<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>LotWork</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<style>
  :root {
    --bg: #0d0f13;
    --bg-2: #090b0e;
    --panel: #14171c;
    --panel-2: #1a1e25;
    --panel-3: #232833;
    --border: #2a303b;
    --border-soft: #1f242c;
    --text: #e9ebef;
    --muted: #a0a7b4;
    --muted-2: #6c7380;
    --accent: #6872ff;
    --accent-2: #8fb0ff;
    --accent-hover: #7b84ff;
    --accent-soft: rgba(104, 114, 255, 0.14);
    --pink: #f472b6;
    --pink-soft: rgba(244, 114, 182, 0.12);
    --green: #3fd28f;
    --green-soft: rgba(63, 210, 143, 0.12);
    --red: #f87171;
    --red-soft: rgba(248, 113, 113, 0.12);
    --yellow: #f5c04e;
    --yellow-soft: rgba(245, 192, 78, 0.12);
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 1px 2px rgba(0,0,0,0.3);
    --shadow-pop: 0 12px 32px rgba(0,0,0,0.45), 0 0 0 1px var(--border);
    --mono: "Cascadia Code", "Cascadia Mono", Consolas, monospace;
    color-scheme: dark;
  }

  :root[data-theme="light"] {
    --bg: #f5f6f8;
    --bg-2: #eef0f3;
    --panel: #ffffff;
    --panel-2: #f3f4f7;
    --panel-3: #e8eaef;
    --border: #dfe2e8;
    --border-soft: #eaecf0;
    --text: #151821;
    --muted: #535b69;
    --muted-2: #8a909b;
    --accent: #5059e6;
    --accent-2: #3d5bd9;
    --accent-hover: #4048d4;
    --accent-soft: rgba(80, 89, 230, 0.1);
    --pink-soft: rgba(219, 39, 119, 0.08);
    --green: #0e9f64;
    --green-soft: rgba(14, 159, 100, 0.1);
    --red: #dc3b3b;
    --red-soft: rgba(220, 59, 59, 0.08);
    --yellow: #b7791f;
    --yellow-soft: rgba(183, 121, 31, 0.1);
    --shadow: 0 1px 2px rgba(20,24,40,0.05);
    --shadow-pop: 0 12px 32px rgba(20,24,40,0.12), 0 0 0 1px var(--border);
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    font-size: 13.5px;
    -webkit-font-smoothing: antialiased;
  }
  code { font-family: var(--mono); }
  .ico { width: 15px; height: 15px; flex-shrink: 0; display: block; }

  /* --- App bar --- */
  header {
    height: 56px; padding: 0 24px;
    display: flex; justify-content: space-between; align-items: center;
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--panel) 88%, transparent);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border-soft);
  }
  header .brand { display: flex; align-items: center; gap: 10px; }
  header .logo {
    width: 28px; height: 28px; border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), var(--pink));
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 14px; color: white;
  }
  header h1 { font-size: 14.5px; margin: 0; font-weight: 700; letter-spacing: 0.1px; line-height: 1.1; }
  header .sub { color: var(--muted-2); font-size: 11px; margin-top: 1px; }
  header .right { display: flex; align-items: center; gap: 8px; }

  /* Segmented controls (env / language / theme) */
  .theme-toggle, .lang-toggle, .env-toggle {
    display: flex; align-items: center; gap: 2px; padding: 2px;
    background: var(--panel-2); border: 1px solid var(--border-soft); border-radius: 8px;
  }
  .theme-toggle button, .lang-toggle button, .env-toggle button {
    background: transparent; border: 1px solid transparent; box-shadow: none;
    padding: 4px 10px; min-height: 26px; border-radius: 6px;
    font-size: 11.5px; font-weight: 600; color: var(--muted-2);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .theme-toggle button { padding: 4px 7px; }
  .theme-toggle button .ico { width: 14px; height: 14px; }
  .theme-toggle button:hover:not(.active), .lang-toggle button:hover:not(.active), .env-toggle button:hover:not(.active) {
    background: transparent; color: var(--text);
  }
  .theme-toggle button.active, .lang-toggle button.active {
    background: var(--panel); color: var(--text); border-color: var(--border); box-shadow: var(--shadow);
  }
  .env-toggle button.active[data-env="local"] { background: var(--green-soft); color: var(--green); }
  .env-toggle button.active[data-env="production"] { background: var(--red-soft); color: var(--red); }

  .caddy-status {
    font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 7px;
    padding: 0 10px; height: 32px; border-radius: 8px;
    background: var(--panel-2); border: 1px solid var(--border-soft); font-weight: 600;
  }
  .caddy-status .cdot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
  .caddy-status.caddy-missing { cursor: pointer; border-color: color-mix(in srgb, var(--red) 50%, transparent); color: var(--red); }
  .caddy-status.caddy-missing:hover { background: var(--red-soft); }

  /* --- Layout --- */
  main { padding: 24px 24px 60px; max-width: 1440px; margin: 0 auto; }
  .main-layout { display: flex; gap: 20px; align-items: flex-start; }
  .main-content { flex: 1; min-width: 0; }

  .toolbar {
    display: flex; gap: 8px; margin-bottom: 16px; align-items: center; flex-wrap: wrap;
  }
  .toolbar-title { font-size: 18px; font-weight: 700; margin-right: auto; display: flex; align-items: baseline; gap: 8px; }
  .toolbar-count { font-size: 12.5px; font-weight: 600; color: var(--muted-2); }

  /* --- Buttons --- */
  button {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--accent); color: #fff;
    border: 1px solid transparent; border-radius: var(--radius-sm);
    padding: 7px 14px; min-height: 34px;
    font: inherit; font-size: 13px; font-weight: 600; line-height: 1.2;
    cursor: pointer; white-space: nowrap;
    transition: background-color .12s, border-color .12s, color .12s, opacity .12s;
  }
  button:hover:not(:disabled) { background: var(--accent-hover); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.secondary { background: var(--panel-2); color: var(--text); border-color: var(--border); }
  button.secondary:hover:not(:disabled) { background: var(--panel-3); }
  button.success { background: var(--green); color: #06140d; }
  button.success:hover:not(:disabled) { background: color-mix(in srgb, var(--green) 88%, white); }
  button.danger { background: var(--red-soft); color: var(--red); }
  button.danger:hover:not(:disabled) { background: color-mix(in srgb, var(--red) 20%, transparent); }
  button.ghost { background: transparent; color: var(--muted); }
  button.ghost:hover:not(:disabled) { background: var(--panel-2); color: var(--text); }
  button.small { padding: 5px 11px; min-height: 30px; font-size: 12.5px; }
  button.icon-btn { padding: 7px 11px; }
  .icon-btn-count { font-size: 12.5px; font-weight: 700; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }

  /* --- Project cards --- */
  .project-grid { display: flex; flex-direction: column; gap: 12px; }

  .project-card {
    background: var(--panel);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    position: relative;
    transition: border-color .15s;
  }
  .project-card:hover { border-color: var(--border); }
  .project-card.running { border-color: color-mix(in srgb, var(--green) 28%, var(--border-soft)); }
  .self-card { border-color: color-mix(in srgb, var(--accent) 30%, var(--border-soft)); }

  .card-body { padding: 16px 18px 14px; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .card-title { display: flex; align-items: center; gap: 10px; min-width: 0; flex-wrap: wrap; }
  .proj-name { font-weight: 650; font-size: 15px; letter-spacing: 0.1px; }
  .card-head-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

  .pin-btn {
    background: transparent; border: none; padding: 2px; min-height: 0;
    color: var(--muted-2); opacity: 0.6;
  }
  .pin-btn .ico { width: 15px; height: 15px; }
  .pin-btn:hover:not(:disabled) { background: transparent; color: var(--yellow); opacity: 1; }
  .pin-btn.pinned { color: var(--yellow); opacity: 1; }
  .pin-btn.pinned .ico { fill: currentColor; }

  .card-sub {
    display: flex; align-items: center; gap: 8px; margin-top: 6px; min-width: 0;
    font-size: 12px; color: var(--muted-2);
  }
  .card-sub .sep { opacity: 0.5; }
  .repo-link {
    display: inline-flex; align-items: center; gap: 5px; color: var(--muted); text-decoration: none;
    font-size: 12px; font-family: var(--mono); flex-shrink: 0; max-width: 50%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .repo-link .ico { width: 13px; height: 13px; }
  .repo-link:hover { color: var(--accent-2); }
  .repo-link.no-remote { color: var(--red); cursor: default; }
  .repo-link.no-remote:hover { color: var(--red); }
  .last-commit { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 9px;
    background: var(--panel-2); border: 1px solid var(--border-soft); border-radius: 6px;
    font-size: 12px; color: var(--muted); max-width: 100%; min-width: 0;
  }
  .chip .ico { width: 13px; height: 13px; color: var(--muted-2); }
  .chip code { font-size: 11.5px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip a.domain-link { color: var(--accent-2); }
  .chip.changes { background: var(--yellow-soft); border-color: transparent; color: var(--yellow); font-weight: 600; }
  .chip.changes .ico { color: currentColor; }
  .chip.muted { background: transparent; border-style: dashed; }
  .branch-vs { color: var(--muted-2); }

  .status-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 9px 3px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600;
    flex-shrink: 0;
  }
  .status-pill.on { background: var(--green-soft); color: var(--green); }
  .status-pill.off { background: var(--panel-2); color: var(--muted-2); }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; }
  .dot.on { background: var(--green); box-shadow: 0 0 0 3px color-mix(in srgb, var(--green) 22%, transparent); }
  .dot.off { background: var(--muted-2); }

  /* Panel tabs along the bottom of each card */
  .card-tabs {
    display: flex; gap: 2px; padding: 6px 10px; flex-wrap: wrap;
    border-top: 1px solid var(--border-soft);
  }
  .tab-btn {
    background: transparent; color: var(--muted); border: none;
    padding: 5px 10px; min-height: 30px; font-size: 12.5px; font-weight: 600; border-radius: 6px;
  }
  .tab-btn .ico { width: 14px; height: 14px; }
  .tab-btn:hover:not(:disabled) { background: var(--panel-2); color: var(--text); }
  .tab-btn.active, .tab-btn.active:hover:not(:disabled) { background: var(--accent-soft); color: var(--accent-2); }
  .tab-count {
    font-size: 10.5px; font-weight: 700; padding: 1px 6px; border-radius: 999px;
    background: var(--panel-3); color: var(--muted);
  }
  .tab-btn.active .tab-count { background: color-mix(in srgb, var(--accent) 22%, transparent); color: inherit; }

  /* Card overflow menu */
  .card-menu-wrap { position: relative; }
  .card-menu-btn {
    background: transparent; border: none; color: var(--muted);
    padding: 0; width: 32px; min-height: 32px; border-radius: 8px;
  }
  .card-menu-btn:hover:not(:disabled) { background: var(--panel-2); color: var(--text); }
  .card-menu {
    position: absolute; top: calc(100% + 4px); right: 0; min-width: 190px; padding: 4px;
    background: var(--panel); border-radius: 10px; box-shadow: var(--shadow-pop); z-index: 15;
  }
  .card-menu button {
    display: flex; justify-content: flex-start; width: 100%; background: transparent; color: var(--text);
    border: none; border-radius: 6px; padding: 7px 10px; min-height: 0; font-size: 13px; font-weight: 500;
  }
  .card-menu button .ico { color: var(--muted); }
  .card-menu button:hover:not(:disabled) { background: var(--panel-2); }
  .card-menu button.menu-danger, .card-menu button.menu-danger .ico { color: var(--red); }
  .card-menu button.menu-danger:hover:not(:disabled) { background: var(--red-soft); }
  .menu-sep { height: 1px; background: var(--border-soft); margin: 4px 2px; }

  .badge {
    display: inline-flex; align-items: center; font-size: 11px; padding: 3px 8px; border-radius: 999px;
    background: var(--panel-2); color: var(--muted); font-weight: 600;
  }
  .self-badge { background: var(--accent-soft); color: var(--accent-2); }
  a.domain-link { color: var(--accent-2); text-decoration: none; font-weight: 600; }
  a.domain-link:hover { text-decoration: underline; }

  .empty-state {
    padding: 64px 20px; text-align: center; color: var(--muted-2);
    background: var(--panel); border: 1px dashed var(--border); border-radius: var(--radius);
    font-size: 13.5px; line-height: 1.8;
  }

  /* --- Services sidebar --- */
  .services-sidebar {
    flex: 0 0 264px; background: var(--panel); border: 1px solid var(--border-soft);
    border-radius: var(--radius); padding: 16px; position: sticky; top: 80px; box-shadow: var(--shadow);
  }
  .sidebar-title {
    font-size: 11px; font-weight: 700; color: var(--muted-2); margin-bottom: 8px;
    text-transform: uppercase; letter-spacing: 0.7px;
  }
  .sidebar-title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .sidebar-title-row .sidebar-title { margin-bottom: 0; }
  .sidebar-refresh { padding: 4px 7px; min-height: 26px; }
  .sidebar-refresh.spinning .ico { animation: spin 0.8s linear infinite; }
  .service-row {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 9px 0; border-bottom: 1px solid var(--border-soft);
  }
  .service-row:last-child { border-bottom: none; }
  .service-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .service-name { font-size: 13px; font-weight: 600; color: var(--text); overflow-wrap: anywhere; }
  .service-sub { font-size: 11px; color: var(--muted-2); display: inline-flex; align-items: center; gap: 5px; }
  .service-toggle {
    flex-shrink: 0; padding: 3px 10px; min-height: 26px; font-size: 11.5px; border-radius: 6px; font-weight: 600;
  }
  .service-toggle.on { background: var(--red-soft); color: var(--red); }
  .service-toggle.on:hover:not(:disabled) { background: color-mix(in srgb, var(--red) 20%, transparent); }
  .service-toggle.off { background: var(--green-soft); color: var(--green); }
  .service-toggle.off:hover:not(:disabled) { background: color-mix(in srgb, var(--green) 20%, transparent); }
  .services-empty { font-size: 12px; color: var(--muted-2); padding: 8px 0; }
  .runtime-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 5px 0; }
  .runtime-name { font-size: 12.5px; color: var(--text); }
  .runtime-version { font-size: 11px; color: var(--muted-2); font-family: var(--mono); }
  .services-divider { border: none; border-top: 1px solid var(--border-soft); margin: 10px 0; }

  @media (max-width: 980px) {
    .main-layout { flex-direction: column; }
    .services-sidebar { flex: 1 1 auto; width: 100%; position: static; }
  }

  /* --- Modals --- */
  .modal-bg {
    display: none; position: fixed; inset: 0; background: rgba(5, 6, 10, 0.6);
    align-items: center; justify-content: center; backdrop-filter: blur(3px);
    z-index: 100;
  }
  :root[data-theme="light"] .modal-bg { background: rgba(20, 24, 40, 0.3); }
  .modal-bg.open { display: flex; animation: fade-in .12s ease-out; }
  .modal-bg.open .modal { animation: pop-in .16s ease-out; }
  @keyframes fade-in { from { opacity: 0; } }
  @keyframes pop-in { from { opacity: 0; transform: translateY(6px) scale(.98); } }
  .modal {
    background: var(--panel); border-radius: 14px; padding: 22px; width: 460px;
    box-shadow: 0 24px 64px rgba(0,0,0,0.4), 0 0 0 1px var(--border);
    max-height: 88vh; overflow-y: auto;
  }
  .modal h2 { margin: 0 0 18px; font-size: 16px; font-weight: 700; }
  .dialog-modal { width: 400px; }
  .dialog-message { font-size: 13.5px; color: var(--text); line-height: 1.6; white-space: pre-line; }
  .dialog-modal.alert-only #dialogCancelBtn { display: none; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  .modal-subtitle { color: var(--muted-2); font-size: 12.5px; margin: -12px 0 18px; line-height: 1.5; }
  .modal-subtitle code { background: var(--panel-2); padding: 1px 5px; border-radius: 4px; }

  /* --- Form fields --- */
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
  .field input, .field select {
    width: 100%; padding: 8px 11px; min-height: 36px; border-radius: var(--radius-sm); border: 1px solid var(--border);
    background: var(--bg-2); color: var(--text); font: inherit; font-size: 13px;
    transition: border-color .12s, box-shadow .12s;
  }
  .field input:focus, .field select:focus {
    outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .domain-input {
    display: flex; align-items: center; border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: var(--bg-2); overflow: hidden;
  }
  .domain-input:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .domain-input input { border: none; background: transparent; flex: 1; box-shadow: none !important; }
  .domain-input input:focus { outline: none; }
  .domain-suffix { padding: 0 11px 0 0; color: var(--muted-2); font-size: 13px; }

  .panel-btn-active { background: var(--accent-soft) !important; color: var(--accent-2) !important; border-color: transparent !important; }

  /* --- Inline panels (logs, env, git, ...) --- */
  .inline-panel {
    padding: 16px 18px 18px; border-top: 1px solid var(--border-soft);
    background: color-mix(in srgb, var(--bg) 45%, var(--panel));
    border-radius: 0 0 var(--radius) var(--radius);
  }
  .inline-panel-title {
    font-size: 11px; font-weight: 700; color: var(--muted-2);
    text-transform: uppercase; letter-spacing: 0.7px;
  }
  .inline-panel-title-row {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;
  }
  .panel-close-btn {
    background: transparent; border: none; color: var(--muted);
    padding: 0; width: 28px; min-height: 28px; border-radius: 6px;
  }
  .panel-close-btn:hover:not(:disabled) { background: var(--panel-3); color: var(--text); }
  .log-box {
    background: var(--bg-2); padding: 12px 14px; border-radius: var(--radius-sm); height: 280px; overflow: auto;
    font-size: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-all;
    font-family: var(--mono); border: 1px solid var(--border-soft); margin: 0; color: var(--text);
  }

  /* Thin overlay-style scrollbars (Docker Desktop-like): no arrows, transparent
     track, a slim rounded thumb that widens a bit and brightens on hover. The
     transparent border + padding-box clip keeps the hit area larger than the
     visible thumb. */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
  ::-webkit-scrollbar-button { display: none; }
  ::-webkit-scrollbar-thumb {
    background: color-mix(in srgb, var(--muted-2) 45%, transparent);
    border: 3px solid transparent; border-radius: 999px; background-clip: padding-box;
    min-height: 32px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background-color: color-mix(in srgb, var(--muted) 70%, transparent);
    border-width: 2px;
  }
  ::-webkit-scrollbar-thumb:active { background-color: var(--muted); border-width: 2px; }

  #envRows { max-height: 380px; overflow-y: auto; margin-bottom: 14px; padding-right: 4px; }
  .env-row-head {
    display: flex; gap: 8px; padding: 0 4px 6px; font-size: 10.5px; font-weight: 700;
    color: var(--muted-2); text-transform: uppercase; letter-spacing: 0.6px;
  }
  .env-row-head .col-key { flex: 0 0 34%; }
  .env-row-head .col-value { flex: 1; }
  .env-row {
    display: flex; gap: 8px; margin-bottom: 6px; align-items: center;
    background: var(--panel); border: 1px solid var(--border-soft); border-radius: var(--radius-sm);
    padding: 4px 6px;
  }
  .env-row:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .env-row input.env-key, .env-row input.env-value {
    background: transparent; border: none; color: var(--text); min-width: 0;
    font-family: var(--mono); font-size: 12.5px; padding: 6px 7px;
  }
  .env-row input.env-key { flex: 0 0 34%; color: var(--accent-2); border-right: 1px solid var(--border-soft); border-radius: 0; }
  .env-row input.env-value { flex: 1; }
  .env-row input:focus { outline: none; box-shadow: none; }
  .source-badge {
    flex-shrink: 0; font-size: 9.5px; font-weight: 700; padding: 3px 7px; border-radius: 5px;

  /* --- Edit Hosts page --- */
  .hosts-page { display: none; }

  body.page-hosts .main-layout { display: none; }
  .hosts-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }

  .hosts-card {

  .hosts-form input, .hosts-filter, .hosts-row input:not([type="checkbox"]) {
    padding: 7px 10px; min-height: 34px; border-radius: var(--radius-sm); border: 1px solid var(--border);

  }

  }
  .hosts-form .h-ip, .hosts-row .h-ip { flex: 0 0 170px; }
  .hosts-form .h-hosts, .hosts-row .h-hosts { flex: 2 1 220px; }
  .hosts-form .h-comment, .hosts-row .h-comment { flex: 1 1 160px; }
  .hosts-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .hosts-filter { width: 260px; max-width: 100%; font-family: inherit; }
  .hosts-row {
    display: flex; gap: 10px; align-items: center; padding: 8px 12px; margin-bottom: 6px;
    background: var(--panel); border: 1px solid var(--border-soft); border-radius: var(--radius-sm);
    flex-wrap: wrap;
  }
  .hosts-row:hover { border-color: var(--border); }
  .hosts-row.disabled .h-text { opacity: 0.45; text-decoration: line-through; }
  .hosts-row .h-text { font-family: var(--mono); font-size: 12.5px; min-width: 0; word-break: break-all; }
  .hosts-row .h-text.h-ip { color: var(--accent-2); }
  .hosts-row .h-text.h-comment { color: var(--muted-2); }
  .hosts-row .h-actions { display: flex; gap: 6px; margin-left: auto; flex-shrink: 0; align-items: center; }
  .hosts-row .h-toggle { width: 16px; height: 16px; flex-shrink: 0; accent-color: var(--accent); cursor: pointer; }
  .hosts-empty { color: var(--muted-2); font-size: 12.5px; padding: 28px 0; text-align: center; }
  .hosts-note { font-size: 12px; color: var(--muted-2); margin-top: 10px; line-height: 1.5; }

  /* --- Credentials / commands / SSH lists --- */
  #credentialsList { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; max-height: 320px; overflow-y: auto; }
  .cred-card {
    background: var(--panel); border: 1px solid var(--border-soft); border-radius: var(--radius-sm);
    padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px;
    margin-bottom: 6px;
  }
  .cred-card:hover { border-color: var(--border); }
  .cred-card-info { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .cred-card-label { font-size: 11px; font-weight: 700; color: var(--accent-2); text-transform: uppercase; letter-spacing: 0.5px; }
  .cred-card-row { display: flex; gap: 8px; align-items: center; font-size: 12.5px; font-family: var(--mono); color: var(--text); min-width: 0; }
  .cred-card-row code { overflow-wrap: anywhere; }
  .copy-btn {
    background: transparent; border: none; color: var(--muted-2); padding: 0; width: 26px; min-height: 26px;
    border-radius: 6px; flex-shrink: 0;
  }
  .copy-btn svg { width: 15px; height: 15px; display: block; }
  .copy-btn:hover:not(:disabled) { background: var(--panel-3); color: var(--text); }
  .copy-btn.copied { color: var(--green); }
  .cred-card-row .cred-field-label { color: var(--muted-2); font-family: "Segoe UI Variable Text", "Segoe UI", sans-serif; min-width: 64px; }
  .cred-card-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .cred-card-actions button {
    padding: 4px 10px; min-height: 28px; font-size: 12px; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border);
  }
  .cred-card-actions button:hover:not(:disabled) { background: var(--panel-3); }
  .cred-card-actions button.remove-cred { color: var(--red); }
  .cred-card-actions button.remove-cred:hover:not(:disabled) { background: var(--red-soft); border-color: transparent; }
  .cred-empty { color: var(--muted-2); font-size: 12.5px; padding: 20px 0; text-align: center; }

  /* --- Git panel --- */
  .git-meta { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 4px; }
  .pull-main-row {
    display: flex; align-items: flex-end; gap: 10px; padding: 12px; margin-top: 12px;
    background: var(--panel); border: 1px dashed var(--border); border-radius: var(--radius-sm);
  }
  .git-branch-settings { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .git-branch-settings .field { flex: 1; min-width: 140px; max-width: 220px; }
  .git-mode-buttons { display: flex; gap: 8px; margin-bottom: 16px; }
  .git-mode-buttons button { flex: 1; }
  .git-main-check-row {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 14px;
    padding-top: 14px; border-top: 1px solid var(--border-soft);
  }
  .git-mode-detail { padding-top: 16px; border-top: 1px solid var(--border-soft); }
  .git-file-list {
    max-height: 260px; overflow-y: auto; margin-bottom: 14px;
    background: var(--panel); border: 1px solid var(--border-soft); border-radius: var(--radius-sm);
  }
  .git-file-row {
    display: flex; align-items: center; gap: 10px; padding: 7px 10px;
    border-bottom: 1px solid var(--border-soft); font-size: 12.5px; cursor: pointer;
  }
  .git-file-row:hover { background: var(--panel-2); }
  .git-file-row:last-child { border-bottom: none; }
  .git-file-row input[type="checkbox"], .git-select-all input[type="checkbox"] {
    accent-color: var(--accent); width: 15px; height: 15px; cursor: pointer; flex-shrink: 0;
  }
  .git-select-all {
    display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700;
    color: var(--muted-2); text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer;
  }
  .git-file-status {
    flex-shrink: 0; width: 74px; font-size: 10px; font-weight: 700; text-transform: uppercase;
    padding: 2px 6px; border-radius: 4px; text-align: center; letter-spacing: 0.3px;
  }
  .git-file-status.status-M { background: var(--yellow-soft); color: var(--yellow); }
  .git-file-status.status-A { background: var(--green-soft); color: var(--green); }
  .git-file-status.status-D { background: var(--red-soft); color: var(--red); }
  .git-file-status.status-R { background: var(--accent-soft); color: var(--accent-2); }
  .git-file-status.status-untracked { background: var(--panel-3); color: var(--muted); }
  .git-file-path { font-family: var(--mono); color: var(--text); word-break: break-all; }
  .git-success {
    background: var(--green-soft); color: var(--green); font-size: 12.5px; padding: 10px 12px;
    border-radius: var(--radius-sm); margin-bottom: 12px;
  }

  .error-msg { color: var(--red); font-size: 12.5px; margin-top: 10px; }

  @media (max-width: 720px) {
    header { padding: 0 16px; }
    header .sub { display: none; }
    main { padding: 16px 16px 50px; }
    .modal { width: 92vw !important; padding: 18px; }
    .card-body { padding: 14px; }
  }

  /* --- Startup splash --- */
  .page-loading {
    position: fixed; inset: 0; z-index: 1000;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: var(--bg); transition: opacity .2s;
  }
  .page-loading.hidden { opacity: 0; pointer-events: none; }
  .page-loading-logo {
    width: 52px; height: 52px; border-radius: 14px;
    background: linear-gradient(135deg, var(--accent), var(--pink));
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 24px; color: white;
  }
  .page-loading-title { font-size: 16px; font-weight: 700; color: var(--text); margin-top: -6px; }
  .page-loading-spinner {
    width: 22px; height: 22px; border-radius: 50%;
    border: 2.5px solid var(--border); border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* --- Docker Compose additions --- */
  .status-pill.partial { background: var(--yellow-soft); color: var(--yellow); }
  .status-pill.partial .dot.on { background: var(--yellow); box-shadow: 0 0 0 3px color-mix(in srgb, var(--yellow) 22%, transparent); }
  .chip-sub { font-size: 11px; color: var(--muted-2); }
  a.chip-link { text-decoration: none; }
  a.chip-link:hover { border-color: var(--accent); color: var(--text); }
  a.chip-link:hover code { color: var(--accent-2); }

  .panel-toolbar { display: flex; gap: 8px; align-items: center; margin: -2px 0 10px; }
  .panel-select, .field-inline-select {
    min-height: 30px; padding: 4px 10px; border-radius: var(--radius-sm); border: 1px solid var(--border);
    background: var(--bg-2); color: var(--text); font: inherit; font-size: 12.5px;
  }
  .panel-select:focus { outline: none; border-color: var(--accent); }

  .svc-list { background: var(--panel); border: 1px solid var(--border-soft); border-radius: var(--radius-sm); }
  .svc-row { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-bottom: 1px solid var(--border-soft); }
  .svc-row:last-child { border-bottom: none; }
  .svc-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
  .svc-name { font-weight: 600; font-size: 13px; }
  .svc-meta { font-size: 11.5px; color: var(--muted-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .svc-ports { display: flex; gap: 6px; flex-wrap: wrap; }
  .port-link {
    font-family: var(--mono); font-size: 11.5px; color: var(--accent-2); text-decoration: none;
    padding: 2px 7px; border-radius: 5px; background: var(--accent-soft);
  }
  .port-link:hover { text-decoration: underline; }
  .svc-actions { display: flex; gap: 6px; flex-shrink: 0; }
  button.icon-only { padding: 0; width: 30px; }

  .archive-section { margin-top: 8px; }
  .archive-toggle {
    background: transparent; color: var(--muted); border: none; padding: 6px 4px; min-height: 0;
    font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px;
  }
  .archive-toggle:hover:not(:disabled) { background: transparent; color: var(--text); }
  .archive-hint { font-weight: 500; text-transform: none; letter-spacing: 0; color: var(--muted-2); margin-left: 4px; }
  .archive-section .project-grid { margin-top: 8px; }
  .project-card.archived { opacity: 0.8; }
  .project-card.archived:hover { opacity: 1; }

  .domain-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .domain-item {
    display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 12px;
    background: var(--panel); border: 1px solid var(--border-soft); border-radius: var(--radius-sm);
  }
  .domain-item:hover { border-color: var(--border); }
  .domain-item > .ico { color: var(--muted-2); }
  .domain-arrow { color: var(--muted-2); }
  .domain-target { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .domain-target code { font-size: 12px; }
  .remove-domain {
    margin-left: auto; background: transparent; color: var(--muted-2); border: none;
    padding: 0; width: 28px; min-height: 28px; border-radius: 6px;
  }
  .remove-domain:hover:not(:disabled) { background: var(--red-soft); color: var(--red); }
  .domain-add { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .domain-add .domain-input { flex: 1 1 220px; }
  .domain-add .domain-input input { padding: 7px 10px; min-height: 32px; color: var(--text); font: inherit; font-size: 13px; }
  .domain-add select {
    flex: 0 1 240px; min-height: 34px; padding: 6px 10px; border-radius: var(--radius-sm);
    border: 1px solid var(--border); background: var(--bg-2); color: var(--text); font: inherit; font-size: 12.5px;
  }
  .path-input { display: flex; gap: 8px; }
  .path-input input { flex: 1; cursor: pointer; font-family: var(--mono); font-size: 12.5px; }
  .domain-row { display: flex; gap: 8px; }
  .domain-row .domain-input { flex: 1; }
  .domain-row select { flex: 0 0 48%; }
  .field-hint { font-size: 11.5px; color: var(--muted-2); margin-top: 6px; white-space: pre-wrap; }
  .field-hint.error { color: var(--red); }

  .browse-modal { width: 520px; }
  .browse-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .browse-bar code {
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 12px; color: var(--muted); background: var(--bg-2); padding: 6px 10px; border-radius: 6px;
  }
  .browse-flag { font-size: 11px; font-weight: 600; color: var(--green); background: var(--green-soft); padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
  .browse-list {
    height: 320px; overflow-y: auto; border: 1px solid var(--border-soft); border-radius: var(--radius-sm);
    background: var(--bg-2); padding: 4px;
  }
  .browse-item {
    display: flex; justify-content: flex-start; width: 100%; background: transparent; color: var(--text);
    border: none; border-radius: 6px; padding: 7px 10px; min-height: 0; font-size: 13px; font-weight: 500;
  }
  .browse-item .ico { color: var(--accent-2); }
  .browse-item:hover:not(:disabled) { background: var(--panel-2); }
  .browse-empty { color: var(--muted-2); font-size: 12.5px; padding: 24px; text-align: center; }
</style>
</head>
<body>

<div class="page-loading" id="pageLoading">
  <div class="page-loading-logo">L</div>
  <div class="page-loading-title">LotWork</div>
  <div class="page-loading-spinner"></div>
</div>

<header>
  <div class="brand">
    <div class="logo">L</div>
    <div>
      <h1>lotwork</h1>
      <div class="sub">Local dev project manager</div>
    </div>
  </div>
  <div class="right">
    <div class="env-toggle" id="envToggle">
      <button data-env="local" title="Local development">Local</button>
      <button data-env="production" title="Production server">Production</button>
    </div>
    <div class="caddy-status" id="dockerStatus"></div>
    <div class="caddy-status" id="caddyStatus"></div>
    <div class="lang-toggle" id="langToggle">
      <button data-lang="en" title="English">EN</button>
      <button data-lang="id" title="Bahasa Indonesia">ID</button>
    </div>
    <div class="theme-toggle" id="themeToggle">
      <button data-theme="light" title="Light"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2m-7.07-17.07 1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg></button>
      <button data-theme="dark" title="Dark"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></button>
    </div>
  </div>
</header>

<main>
  <div class="main-layout">
    <div class="main-content">
      <div class="toolbar">
        <div class="toolbar-title"><span id="projectsTitle">Projects</span><span class="toolbar-count" id="projectsCount"></span></div>
        <button class="secondary icon-btn" id="toggleSidejobsBtn" style="display:none;" onclick="toggleShowSidejobs()"></button>
        <button class="secondary" id="syncBtn" onclick="syncAll()">Sync</button>
        <button class="secondary" id="editHostsBtn" onclick="location.hash = '#hosts'">Edit Hosts</button>
        <button class="secondary" id="reloadCaddyBtn" onclick="reloadCaddy()">Reload Caddy / Sync Domains</button>
        <button id="addProjectBtn" onclick="openAddModal()">Add Project</button>
      </div>

      <div class="project-grid" id="projectRows"></div>
    </div>

    <aside class="services-sidebar">
      <div class="sidebar-title-row">
        <div class="sidebar-title" id="servicesTitle">Services</div>
        <button class="secondary small sidebar-refresh" id="servicesRefreshBtn" onclick="refreshServices()"></button>
      </div>
      <div id="servicesList"></div>
    </aside>
  </div>

  <section class="hosts-page" id="hostsPage"></section>
</main>

<div class="modal-bg" id="addModal">
  <div class="modal">
    <h2 id="modalTitle">Add Project</h2>
    <input type="hidden" id="editId" />
    <div class="field">
      <label id="lblName">Project name</label>
      <input id="fName" placeholder="my-app" />
    </div>
    <div class="field">
      <label id="lblDistro">WSL distro</label>
      <select id="fDistro" onchange="onDistroChange()"></select>
    </div>
    <div class="field">
      <label id="lblFolder">Project folder</label>
      <div class="path-input">
        <input id="fCwdDisplay" readonly placeholder="/home/you/projects/my-app" onclick="openBrowseModal()" />
        <button type="button" class="secondary" id="browseBtn" onclick="openBrowseModal()">Browse</button>
      </div>
      <input type="hidden" id="fCwd" />
    </div>
    <div class="field">
      <label id="lblCompose">Compose file</label>
      <select id="fComposeFile" onchange="onComposeFileChange()"></select>
      <div class="field-hint" id="composeHint"></div>
    </div>
    <div class="error-msg" id="formError"></div>
    <div class="modal-actions">
      <button class="secondary" id="addModalCancelBtn" onclick="closeAddModal()">Cancel</button>
      <button id="addModalSaveBtn" onclick="submitProject()">Save</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="browseModal">
  <div class="modal browse-modal">
    <h2 id="browseTitle">Choose a folder in WSL</h2>
    <div class="browse-bar">
      <button type="button" class="secondary small icon-only" id="browseUpBtn" title="Up" onclick="browseUp()"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg></button>
      <code id="browsePath"></code>
      <span class="browse-flag" id="browseComposeFlag" style="display:none">compose</span>
    </div>
    <div class="browse-list" id="browseList"></div>
    <div class="modal-actions">
      <button class="secondary" id="browseCancelBtn" onclick="closeBrowseModal()">Cancel</button>
      <button id="browseSelectBtn" onclick="selectBrowsedFolder()">Select this folder</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="credentialModal">
  <div class="modal">
    <h2 id="credModalTitle">Add Credential</h2>
    <input type="hidden" id="credModalProjectId" />
    <input type="hidden" id="credModalId" />
    <div class="field">
      <label id="lblCredLabel">Label (optional)</label>
      <input id="credModalLabel" placeholder="e.g. Admin, Test User" />
    </div>
    <div class="field">
      <label id="lblCredUsername">Username / Email</label>
      <input id="credModalUsername" placeholder="admin@example.com" />
    </div>
    <div class="field">
      <label id="lblCredPassword">Password</label>
      <input id="credModalPassword" placeholder="password" />
    </div>
    <div class="error-msg" id="credModalError"></div>
    <div class="modal-actions">
      <button class="secondary" id="credModalCancelBtn" onclick="closeCredentialModal()">Cancel</button>
      <button id="credModalSaveBtn" onclick="saveCredentialModal()">Save</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="sshModal">
  <div class="modal">
    <h2 id="sshModalTitle">Add SSH Target</h2>
    <input type="hidden" id="sshModalProjectId" />
    <input type="hidden" id="sshModalId" />
    <div class="field">
      <label id="lblSshLabel">Label (optional)</label>
      <input id="sshModalLabel" placeholder="e.g. Production" />
    </div>
    <div class="field">
      <label id="lblSshHost">IP / Host</label>
      <input id="sshModalHost" placeholder="203.0.113.10" />
    </div>
    <div class="field">
      <label id="lblSshPort">Port</label>
      <input id="sshModalPort" type="number" placeholder="22" />
    </div>
    <div class="field">
      <label id="lblSshUsername">Username</label>
      <input id="sshModalUsername" placeholder="root" />
    </div>
    <div class="field">
      <label id="lblSshPassword">Password</label>
      <input id="sshModalPassword" type="password" placeholder="password" />
    </div>

<script>
let projects = [];

let showSidejobs = false;
let cardMenuOpenId = null;

// --- Custom alert/confirm dialogs (replaces native browser alert/confirm) ---
let dialogResolveFn = null;

function dialogResolve(result) {
  document.getElementById('dialogModal').classList.remove('open');
  if (dialogResolveFn) {
    dialogResolveFn(result);
    dialogResolveFn = null;
  }
}

function showAlert(message, title) {
  return new Promise((resolve) => {
    dialogResolveFn = () => resolve();
    document.getElementById('dialogTitle').textContent = title || 'lotwork';
    document.getElementById('dialogMessage').textContent = message;
    document.querySelector('#dialogModal .dialog-modal').classList.add('alert-only');
    document.getElementById('dialogOkBtn').textContent = 'OK';
    document.getElementById('dialogModal').classList.add('open');
  });
}

function showConfirm(message, title) {
  return new Promise((resolve) => {
    dialogResolveFn = (result) => resolve(result);
    document.getElementById('dialogTitle').textContent = title || 'lotwork';
    document.getElementById('dialogMessage').textContent = message;
    document.querySelector('#dialogModal .dialog-modal').classList.remove('alert-only');
    document.getElementById('dialogOkBtn').textContent = 'OK';
    document.getElementById('dialogModal').classList.add('open');
  });
}

let lastProjectsJson = '';

async function fetchProjects(isBackgroundPoll) {
  const res = await fetch('/api/projects');
  const text = await res.text();
  // Background polls usually return exactly what's already on screen; skip
  // the wholesale innerHTML rebuild then. User-triggered fetches always
  // render, since local UI state (expanded panels, menus) may have changed.
  if (isBackgroundPoll && text === lastProjectsJson) return;
  lastProjectsJson = text;
  projects = JSON.parse(text);
  // Re-rendering replaces #projectRows' innerHTML wholesale, which would
  // kill focus (and the cursor position) of any input the user is actively
  // typing in - e.g. the add-command or credential fields inside an
  // expanded panel. Only skip the rebuild for the silent background poll;
  // a render triggered by the user's own action (clicking Run, Start, etc.)
  // must still happen so the UI reflects what they just did.
  if (isBackgroundPoll && isTypingInProjectRows()) return;
  render();
}

function isTypingInProjectRows() {
  const active = document.activeElement;
  if (!active) return false;
  const tag = active.tagName;
  if (tag !== 'INPUT' && tag !== 'TEXTAREA' && tag !== 'SELECT') return false;
  const projectRows = document.getElementById('projectRows');
  return projectRows && projectRows.contains(active);
}

let showArchive = false;

function render() {
  const active = projects.filter(p => p.isSelf || p.kind === 'compose');
  const archived = projects.filter(p => p.kind === 'legacy');
  const visibleProjects = active.filter(p => p.isSelf || (showSidejobs ? p.isSidejob : !p.isSidejob));
  const count = visibleProjects.filter(p => !p.isSelf).length;

  let html = visibleProjects.map(p => p.isSelf ? renderSelfCard(p) : renderComposeCard(p)).join('');
  if (count === 0) html += `<div class="empty-state">${t('emptyState')}</div>`;
  if (archived.length && !showSidejobs) html += renderArchiveSection(archived);

  document.getElementById('projectRows').innerHTML = html;
  document.getElementById('projectsCount').textContent = String(count);
  restoreLogScroll();
  updateSidejobToggleLabel();
}

}

// --- WSL paths (stored as \\wsl.localhost\<distro>\... UNC paths) ---
function parseWslPath(unc) {
  const match = /^\\\\wsl(?:\.localhost|\$)\\([^\\]+)(\\.*)?$/i.exec(unc || '');
  if (!match) return null;
  const linuxPath = (match[2] || '\\').replace(/\\/g, '/').replace(/(.)\/+$/, '$1');
  return { distro: match[1], linuxPath };
}

function shortLinuxPath(linuxPath) {
  return linuxPath.replace(/^\/home\/[^/]+/, '~');
}

function composeFileLabel(p) {
  const file = parseWslPath(p.composeFile);
  const dir = parseWslPath(p.cwd);
  if (!file) return p.composeFile || '';
  if (dir && file.linuxPath.startsWith(dir.linuxPath + '/')) return file.linuxPath.slice(dir.linuxPath.length + 1);
  return shortLinuxPath(file.linuxPath);
}

// --- Docker Compose project card ---
const pendingAction = new Map(); // projectId -> 'start' | 'stop' | 'restart' | 'down'

function renderStatusPill(status) {
  if (status.state === 'partial') {
    return `<span class="status-pill partial"><span class="dot on"></span>${t('partialRunning', status.runningCount, status.total)}</span>`;
  }
  const on = status.running;
  return `<span class="status-pill ${on ? 'on' : 'off'}"><span class="dot ${on ? 'on' : 'off'}"></span>${on ? t('running') : t('stopped')}</span>`;
}

function renderPortChips(p) {
  const status = p.status || {};
  const source = status.running && status.ports && status.ports.length
    ? status.ports.map(pt => ({ service: pt.service, hostPort: pt.hostPort }))
    : (p.ports || []);
  const seen = new Set();
  return source.filter(pt => !seen.has(pt.hostPort) && seen.add(pt.hostPort)).map(pt => {
    const inner = `${icon('plug')}<code>${pt.hostPort}</code><span class="chip-sub">${escapeHtml(pt.service)}</span>`;
    return status.running
      ? `<a class="chip chip-link" href="http://localhost:${pt.hostPort}" target="_blank" title="http://localhost:${pt.hostPort}">${inner}</a>`
      : `<span class="chip">${inner}</span>`;
  }).join('');
}

function renderComposeCard(p) {
  const status = p.status || { running: false, services: [] };
  const running = status.running;
  const busy = pendingIds.has(p.id);
  const action = pendingAction.get(p.id);
  const busyLabel = { start: t('starting'), stop: t('stopping'), restart: t('restarting'), down: t('stopping') }[action] || t('starting');
  const toggleBtn = running
    ? `<button class="danger small" ${busy ? 'disabled' : ''} onclick="stopProject('${p.id}')">${icon('stop')}<span>${busy ? busyLabel : t('stop')}</span></button>`
    : `<button class="success small" ${busy ? 'disabled' : ''} onclick="startProject('${p.id}')">${icon('play')}<span>${busy ? busyLabel : t('start')}</span></button>`;
  const lastStarted = p.lastStartedAt ? formatLastStarted(p.lastStartedAt) : null;
  const folder = parseWslPath(p.cwd);

  const chips = [
    folder ? `<span class="chip" title="${escapeHtml(folder.distro + ':' + folder.linuxPath)}">${icon('folder')}<code>${escapeHtml(shortLinuxPath(folder.linuxPath))}</code></span>` : '',
    `<span class="chip" title="${escapeHtml(t('fieldCompose'))}: ${escapeHtml(p.composeProject || '')}">${icon('box')}<code>${escapeHtml(composeFileLabel(p))}</code></span>`,
    renderPortChips(p),
    (p.domains || []).map(d => `<span class="chip">${icon('globe')}<a class="domain-link" href="https://${d.domain}" target="_blank">${d.domain}</a><span class="chip-sub">${escapeHtml(d.service || '')}:${d.port}</span></span>`).join(''),
    renderBranchChip(p),
    renderChangesBadge(p),
    lastStarted ? `<span class="chip" title="${t('lastStarted')}">${icon('clock')}${lastStarted}</span>` : '',
  ].join('');

  return `
    <div class="project-card ${running ? 'running' : ''} ${p.pinned ? 'pinned' : ''}">
      <div class="card-body">
        <div class="card-head">
          <div class="card-title">
            <span class="proj-name">${escapeHtml(p.name)}</span>
            <button type="button" class="pin-btn ${p.pinned ? 'pinned' : ''}" title="${p.pinned ? t('unpinProject') : t('pinProject')}" onclick="togglePin('${p.id}')">${icon('star')}</button>
            ${renderStatusPill(status)}
          </div>
          <div class="card-head-actions">
            ${toggleBtn}
            <div class="card-menu-wrap">
              <button type="button" class="card-menu-btn" title="${t('moreOptions')}" onclick="toggleCardMenu(event, '${p.id}')">${icon('more')}</button>
              ${cardMenuOpenId === p.id ? `
                <div class="card-menu">
                  <button type="button" ${busy ? 'disabled' : ''} onclick="openEditModal('${p.id}')">${icon('edit')}<span>${t('edit')}</span></button>
                  ${running ? `<button type="button" ${busy ? 'disabled' : ''} onclick="restartProject('${p.id}')">${icon('refresh')}<span>${t('restart')}</span></button>` : ''}
                  <button type="button" ${busy ? 'disabled' : ''} onclick="refreshProject('${p.id}')">${icon('file')}<span>${t('refreshCompose')}</span></button>
                  <button type="button" onclick="toggleSidejob('${p.id}', ${!p.isSidejob})">${icon('layers')}<span>${p.isSidejob ? t('unsetSidejob') : t('setSidejob')}</span></button>
                  <div class="menu-sep"></div>
                  <button type="button" class="menu-danger" ${busy ? 'disabled' : ''} onclick="downProject('${p.id}')">${icon('down')}<span>${t('down')}</span></button>
                  <button type="button" class="menu-danger" ${busy ? 'disabled' : ''} onclick="deleteProject('${p.id}')">${icon('trash')}<span>${t('delete')}</span></button>
                </div>
              ` : ''}
            </div>
          </div>
        </div>
        ${renderCardSub(p)}
        <div class="chips">${chips}</div>
      </div>
      <div class="card-tabs">
        ${tabBtn(p, 'services', 'box', t('services'), status.total ? `${status.runningCount}/${status.total}` : 0)}
        ${tabBtn(p, 'domains', 'globe', t('domains'), (p.domains || []).length)}
        ${tabBtn(p, 'logs', 'logs', t('logs'))}
        ${tabBtn(p, 'env', 'env', t('editEnv'))}
        ${tabBtn(p, 'credentials', 'key', t('credentials'), (p.credentials || []).length)}
        ${tabBtn(p, 'commands', 'zap', t('commands'), (p.commands || []).length)}
        ${tabBtn(p, 'ssh', 'server', t('ssh'), (p.sshTargets || []).length)}
        ${tabBtn(p, 'git', 'branch', t('github'))}
      </div>
      ${renderPanel(p)}
    </div>
  `;
}

// --- Services panel (one row per compose service) ---
const servicePendingKeys = new Set(); // `${projectId}:${service}`

function renderServicesPanel(p) {
  const services = (p.status && p.status.services) || [];
  const rows = services.length ? services.map(s => {
    const busy = servicePendingKeys.has(`${p.id}:${s.name}`) || pendingIds.has(p.id);
    const isRunning = s.state === 'running';
    const ports = s.ports.map(pt => `<a class="port-link" href="http://localhost:${pt.hostPort}" target="_blank">:${pt.hostPort}</a>`).join('');
    const detail = s.state === 'not-created' ? t('notCreated') : (s.status || s.state);
    const actions = isRunning
      ? `<button class="secondary small icon-only" title="${t('restart')}" ${busy ? 'disabled' : ''} onclick="serviceAction('${p.id}', '${s.name}', 'restart')">${icon('refresh')}</button>
         <button class="danger small icon-only" title="${t('stop')}" ${busy ? 'disabled' : ''} onclick="serviceAction('${p.id}', '${s.name}', 'stop')">${icon('stop')}</button>`
      : `<button class="success small icon-only" title="${t('start')}" ${busy ? 'disabled' : ''} onclick="serviceAction('${p.id}', '${s.name}', 'start')">${icon('play')}</button>`;
    return `
      <div class="svc-row">
        <span class="dot ${isRunning ? 'on' : 'off'}"></span>
        <div class="svc-info">
          <span class="svc-name">${escapeHtml(s.name)}</span>
          <span class="svc-meta">${s.image ? `${escapeHtml(s.image)} · ` : ''}${escapeHtml(detail)}</span>
        </div>
        <div class="svc-ports">${ports}</div>
        <div class="svc-actions">${actions}</div>
      </div>
    `;
  }).join('') : `<div class="cred-empty">${t('noServices')}</div>`;

  return `
    <div class="inline-panel">
      ${panelTitleWithClose(p.id, 'services', t('services'))}
      <div class="svc-list">${rows}</div>
    </div>
  `;
}

async function serviceAction(id, service, action) {
  const key = `${id}:${service}`;
  if (servicePendingKeys.has(key)) return;
  servicePendingKeys.add(key);
  render();
  try {
    const res = await fetch(`/api/projects/${id}/services/${encodeURIComponent(service)}/${action}`, { method: 'POST' });
    const data = await res.json();
    if (!res.ok) await showAlert(data.error);
  } catch (e) {
    await showAlert(e.message);
  } finally {
    servicePendingKeys.delete(key);
    await fetchProjects();
  }
}

// --- Domains panel (several custom .local domains per project) ---
const domainDrafts = new Map(); // projectId -> { name, port }
const domainBusy = new Set();

function renderDomainsPanel(p) {
  const domains = p.domains || [];
  const draft = domainDrafts.get(p.id) || { name: '', port: '' };
  const ports = p.ports || [];
  const busy = domainBusy.has(p.id) ? 'disabled' : '';

  const list = domains.length
    ? domains.map(d => `
        <div class="domain-item">
          ${icon('globe')}
          <a class="domain-link" href="https://${d.domain}" target="_blank">${d.domain}</a>
          <span class="domain-arrow">→</span>
          <span class="domain-target">${d.service ? `<span class="badge">${escapeHtml(d.service)}</span>` : ''}<code>localhost:${d.port}</code></span>
          <button type="button" class="remove-domain" title="${t('delete')}" ${busy} onclick="deleteDomain('${p.id}', '${d.id}')">${icon('trash')}</button>
        </div>
      `).join('')
    : `<div class="cred-empty">${t('noDomainsYet')}</div>`;

  const portOptions = `<option value="">${t('domainPortPlaceholder')}</option>` + ports.map(pt =>
    `<option value="${pt.hostPort}" ${String(draft.port) === String(pt.hostPort) ? 'selected' : ''}>${escapeHtml(pt.service)} → localhost:${pt.hostPort}</option>`).join('');

  return `
    <div class="inline-panel">
      ${panelTitleWithClose(p.id, 'domains', t('domains'))}
      <div class="modal-subtitle" style="margin-top:0">${t('domainsHint')}</div>
      <div class="domain-list">${list}</div>
      ${ports.length ? `
        <div class="domain-add">
          <div class="domain-input">
            <input value="${escapeHtml(draft.name)}" placeholder="${t('domainNamePlaceholder')}" oninput="updateDomainDraft('${p.id}', 'name', this.value)" onkeydown="if (event.key === 'Enter') addDomain('${p.id}')" />
            <span class="domain-suffix">.local</span>
          </div>
          <select onchange="updateDomainDraft('${p.id}', 'port', this.value)">${portOptions}</select>
          <button type="button" class="small" ${busy} onclick="addDomain('${p.id}')">${icon('plus')}<span>${t('addDomain')}</span></button>
        </div>
      ` : `<div class="field-hint">${t('noPublishedPorts')}</div>`}
    </div>
  `;
}

function updateDomainDraft(id, field, value) {
  const draft = domainDrafts.get(id) || { name: '', port: '' };
  draft[field] = value;
  domainDrafts.set(id, draft);
}

async function showDomainSyncResult(data) {
  if (data.sync && data.sync.hostsOk === false) {
    await showAlert(`${t('hostsSyncFailedAlert')}\n\n${data.sync.hostsMessage}\n\n${t('hostsSyncFailedHint')}`);
  }
  if (data.nextOrigin && data.nextOrigin.ok === false && data.nextOrigin.reason === 'unrecognized_format') {
    await showAlert(`${t('nextOriginUnrecognized')}\n\n${data.nextOrigin.message}`);
  }
}

async function addDomain(id) {
  const draft = domainDrafts.get(id) || { name: '', port: '' };
  const name = draft.name.trim().replace(/\.local$/, '');
  if (!name || !draft.port) {
    await showAlert(t('domainRequiredError'));
    return;
  }
  domainBusy.add(id);
  render();
  try {
    const res = await fetch(`/api/projects/${id}/domains`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ domain: name, port: Number(draft.port) }),
    });
    const data = await res.json();
    if (!res.ok) {
      await showAlert(data.error);
      return;
    }
    domainDrafts.delete(id);
    await showDomainSyncResult(data);
  } finally {
    domainBusy.delete(id);
    await fetchProjects();
    checkCaddyStatus();
  }
}

async function deleteDomain(id, domainId) {
  if (!(await showConfirm(t('confirmDeleteDomain')))) return;
  domainBusy.add(id);
  render();
  try {
    const res = await fetch(`/api/projects/${id}/domains/${domainId}`, { method: 'DELETE' });
    const data = await res.json();
    if (!res.ok) await showAlert(data.error);
    else await showDomainSyncResult(data);
  } finally {
    domainBusy.delete(id);
    await fetchProjects();
  }
}

function formatLastStarted(timestamp) {
  const date = new Date(timestamp);
  const time = date.toLocaleTimeString('id-ID', {
    hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Jakarta',
  });
  const today = new Date();
  const isToday = date.toDateString() === today.toDateString();
  if (isToday) return `${time} WIB`;
  const dateStr = date.toLocaleDateString('id-ID', {
    day: '2-digit', month: 'short', timeZone: 'Asia/Jakarta',
  });
  return `${dateStr}, ${time} WIB`;
}

function formatCommitDate(gitDateStr) {
  // git's %ci format: "2026-09-19 12:27:19 +0700" - parseable by Date directly
  const date = new Date(gitDateStr.replace(' ', 'T').replace(' ', ''));
  if (isNaN(date.getTime())) return gitDateStr;
  const locale = getLang() === 'id' ? 'id-ID' : 'en-US';
  return date.toLocaleString(locale, {
    day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit',
  });
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

const COPY_ICON = `<svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect x="7" y="7" width="10" height="10" rx="2" stroke="currentColor" stroke-width="1.6"/>
  <path d="M13 7V5.5C13 4.67157 12.3284 4 11.5 4H4.5C3.67157 4 3 4.67157 3 5.5V12.5C3 13.3284 3.67157 14 4.5 14H6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
</svg>`;

const CHECK_ICON = `<svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M4 10.5L8 14.5L16 5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>`;

async function copyElementText(btn, elementId) {
  const el = document.getElementById(elementId);
  if (!el) return;
  await copyToClipboard(btn, el.textContent);
}

async function copyToClipboard(btn, text) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }
  const original = btn.innerHTML;
  btn.innerHTML = btn.dataset.iconOnly === 'true' ? CHECK_ICON : t('copied');
  btn.classList.add('copied');
  setTimeout(() => {
    btn.innerHTML = original;
    btn.classList.remove('copied');
  }, 1200);
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

// `docker compose up -d` can take a while (image pulls/builds), so the
// button stays in its busy state until the request comes back.
async function runProjectAction(id, action) {
  if (pendingIds.has(id)) return;
  pendingIds.add(id);
  pendingAction.set(id, action);
  cardMenuOpenId = null;
  render();
  try {
    const res = await fetch(`/api/projects/${id}/${action}`, { method: 'POST' });
    const data = await res.json();
    if (!res.ok) {
      await showAlert(data.error || t('dockerActionFailed'));
      if (action === 'start' && expandedPanels.get(id) !== 'logs') togglePanel(id, 'logs');
    }
  } catch (e) {
    await showAlert(e.message);
  } finally {
    pendingIds.delete(id);
    pendingAction.delete(id);
    await fetchProjects();
  }
}

const startProject = (id) => runProjectAction(id, 'start');
const stopProject = (id) => runProjectAction(id, 'stop');
const restartProject = (id) => runProjectAction(id, 'restart');

async function downProject(id) {
  cardMenuOpenId = null;
  if (!(await showConfirm(t('confirmDown')))) return render();
  await runProjectAction(id, 'down');

async function refreshProject(id) {
  cardMenuOpenId = null;
  render();
  const res = await fetch(`/api/projects/${id}/refresh`, { method: 'POST' });
  const data = await res.json();
  if (!res.ok) await showAlert(data.error);
  await fetchProjects();
}

async function deleteProject(id) {
  cardMenuOpenId = null;
  if (!(await showConfirm(t('confirmDeleteProject')))) return render();
  if (pendingIds.has(id)) return;
  pendingIds.add(id);
  render();

    pendingIds.delete(id);

// --- Add / Edit project modal ---
function setFormError(message) {
  document.getElementById('formError').textContent = message || '';
}

function setComposeHint(text, isError) {
  const el = document.getElementById('composeHint');
  el.textContent = text || '';
  el.classList.toggle('error', Boolean(isError));
}

async function loadDistros(selected) {
  const select = document.getElementById('fDistro');
  const res = await fetch('/api/wsl/distros');
  const { distros } = await res.json();
  select.innerHTML = distros.map(d => `<option value="${escapeHtml(d)}">${escapeHtml(d)}</option>`).join('');
  if (!distros.length) {
    setFormError(t('noWslDistro'));
    return;
  }
  const match = selected && distros.find(d => d.toLowerCase() === selected.toLowerCase());
  select.value = match || distros[0];
}

function onDistroChange() {
  setFolder('', { skipCompose: true });
  fillComposeSelect([]);
  setComposeHint('');
}

async function setFolder(unc, { skipCompose, selectCompose } = {}) {
  document.getElementById('fCwd').value = unc;
  const parsed = parseWslPath(unc);
  document.getElementById('fCwdDisplay').value = parsed ? parsed.linuxPath : '';
  if (!unc || skipCompose) return;
  const nameField = document.getElementById('fName');
  if (!nameField.value.trim() && parsed) nameField.value = parsed.linuxPath.split('/').filter(Boolean).pop() || '';
  await loadComposeFiles(selectCompose);
}

function fillComposeSelect(files, selected) {
  const select = document.getElementById('fComposeFile');
  select.innerHTML = files.length
    ? files.map(f => `<option value="${escapeHtml(f.path)}">${escapeHtml(f.label)}</option>`).join('')
    : `<option value="">${t('noComposeFiles')}</option>`;
  if (!files.length) return;
  // Prefer the canonical compose file at the folder root when there are several.
  const preferred = files.find(f => f.path === selected)
    || files.find(f => /^(docker-)?compose\.ya?ml$/i.test(f.label))
    || files[0];
  select.value = preferred.path;
}

async function loadComposeFiles(selected) {
  const dir = document.getElementById('fCwd').value;
  if (!dir) return;
  setComposeHint(t('inspecting'));
  const res = await fetch(`/api/wsl/compose-files?dir=${encodeURIComponent(dir)}`);
  const data = await res.json();
  if (!res.ok) {
    fillComposeSelect([]);
    setComposeHint(data.error, true);
    return;
  }
  fillComposeSelect(data.files, selected);
  await onComposeFileChange();
}

let composeInspectSeq = 0;
async function onComposeFileChange() {
  const composeFile = document.getElementById('fComposeFile').value;
  if (!composeFile) {
    setComposeHint(document.getElementById('fCwd').value ? t('noComposeFiles') : '', true);
    return;
  }
  const seq = ++composeInspectSeq;
  setComposeHint(t('inspecting'));
  const res = await fetch('/api/compose/inspect', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ composeFile }),
  });
  const data = await res.json();
  if (seq !== composeInspectSeq) return; // a newer selection is in flight
  if (!res.ok) {
    setComposeHint(data.error, true);
    return;
  }
  setComposeHint(t('composeSummary', data.name, data.services.length));
}

function resetProjectForm() {
  document.getElementById('editId').value = '';
  document.getElementById('fName').value = '';
  document.getElementById('fCwd').value = '';
  document.getElementById('fCwdDisplay').value = '';

async function submitProject() {
  const id = document.getElementById('editId').value;
  const body = {
    name: document.getElementById('fName').value.trim(),
    cwd: document.getElementById('fCwd').value,
    composeFile: document.getElementById('fComposeFile').value,

    setFormError(t('requiredFieldsError'));
    return;
  }
  const saveBtn = document.getElementById('addModalSaveBtn');
  saveBtn.disabled = true;
  saveBtn.textContent = t('saving');
  try {
    const res = await fetch(id ? `/api/projects/${id}` : '/api/projects', {
      method: id ? 'PUT' : 'POST',
      headers: { 'Content-Type': 'application/json' },

      setFormError(data.error);

    saveBtn.textContent = t('save');

  fetchProjects();
}

const browseState = { distro: '', path: '', dirs: [], unc: '' };

async function openBrowseModal() {
  const distro = document.getElementById('fDistro').value;
  if (!distro) {
    setFormError(t('noWslDistro'));
    return;
  }
  const current = parseWslPath(document.getElementById('fCwd').value);

  await browseTo(current && current.distro === distro ? current.linuxPath : '');

function closeBrowseModal() {
  document.getElementById('browseModal').classList.remove('open');

async function browseTo(linuxPath) {
  const list = document.getElementById('browseList');
  list.innerHTML = `<div class="browse-empty">${t('loadingLogs')}</div>`;
  const query = new URLSearchParams({ distro: browseState.distro });
  if (linuxPath) query.set('path', linuxPath);
  const res = await fetch(`/api/wsl/browse?${query}`);
  const data = await res.json();
  if (!res.ok) {
    list.innerHTML = `<div class="browse-empty error-msg">${escapeHtml(data.error)}</div>`;
    return;
  }
  Object.assign(browseState, { path: data.path, dirs: data.dirs, unc: data.unc });
  document.getElementById('browsePath').textContent = `${data.distro}:${data.path}`;
  document.getElementById('browseUpBtn').disabled = data.path === '/';
  document.getElementById('browseComposeFlag').style.display = data.hasCompose ? '' : 'none';
  list.innerHTML = data.dirs.length
    ? data.dirs.map((d, i) => `<button type="button" class="browse-item" onclick="browseInto(${i})">${icon('folder')}<span>${escapeHtml(d)}</span></button>`).join('')
    : `<div class="browse-empty">${t('browseEmpty')}</div>`;
}

function browseInto(index) {
  const name = browseState.dirs[index];
  browseTo(browseState.path === '/' ? `/${name}` : `${browseState.path}/${name}`);
}

function browseUp() {
  const parent = browseState.path.replace(/\/[^/]+$/, '') || '/';
  browseTo(parent);
}

async function selectBrowsedFolder() {
  closeBrowseModal();
  await setFolder(browseState.unc);
}

// --- Inline expandable panels (Logs / Edit .env / Credentials) ---
const expandedPanels = new Map(); // projectId -> 'logs' | 'env' | 'credentials'
const envDrafts = new Map(); // projectId -> { entries, loaded, error }
const logCache = new Map(); // projectId -> last fetched log text

function togglePanel(id, type) {
  const current = expandedPanels.get(id);
  if (current === type) {
    expandedPanels.delete(id);
  } else {
    expandedPanels.set(id, type);
    if (type === 'env' && !envDrafts.has(id)) loadEnvDraft(id);
    if (type === 'logs') pollLogsFor(id);
    if (type === 'git') loadGitStatus(id);
  }
  render();
}

function panelTitleWithClose(id, type, label) {
  return `
    <div class="inline-panel-title-row">
      <div class="inline-panel-title">${label}</div>
      <button type="button" class="panel-close-btn" title="${t('close')}" onclick="togglePanel('${id}', '${type}')">${icon('x')}</button>
    </div>
  `;
}

function renderPanel(p) {
  const type = expandedPanels.get(p.id);
  if (!type) return '';
  if (type === 'services') return renderServicesPanel(p);
  if (type === 'domains') return renderDomainsPanel(p);
  if (type === 'logs') return renderLogsPanel(p);
  if (type === 'env') return renderEnvPanel(p);
  if (type === 'credentials') return renderCredentialsPanel(p);
  if (type === 'git') return renderGitPanel(p);
  if (type === 'commands') return renderCommandsPanel(p);
  if (type === 'ssh') return renderSshPanel(p);
  return '';
}

// --- Logs panel (docker compose logs, optionally for one service) ---
const logServiceById = new Map(); // projectId -> service name ('' = all)

function renderLogsPanel(p) {
  const logs = logCache.get(p.id) || t('loadingLogs');
  const selected = logServiceById.get(p.id) || '';
  const services = ((p.status && p.status.services) || []).map(s => s.name);
  const options = [`<option value="">${t('logsAllServices')}</option>`]
    .concat(services.map(s => `<option value="${escapeHtml(s)}" ${selected === s ? 'selected' : ''}>${escapeHtml(s)}</option>`))
    .join('');
  return `
    <div class="inline-panel">
      ${panelTitleWithClose(p.id, 'logs', t('logs'))}
      <div class="panel-toolbar">
        <select class="panel-select" onchange="setLogService('${p.id}', this.value)">${options}</select>
        <button type="button" class="secondary small" onclick="copyElementText(this, 'logBox-${p.id}')">${t('copyLogs')}</button>
      </div>
      <pre class="log-box" id="logBox-${p.id}">${escapeHtml(logs)}</pre>
    </div>
  `;
}

function setLogService(id, service) {
  logServiceById.set(id, service);
  logCache.delete(id);
  render();
  pollLogsFor(id);
}

const logsInFlight = new Set();
async function pollLogsFor(id) {
  if (expandedPanels.get(id) !== 'logs' || logsInFlight.has(id)) return;
  logsInFlight.add(id);
  try {
    const service = logServiceById.get(id) || '';
    const res = await fetch(`/api/projects/${id}/logs${service ? `?service=${encodeURIComponent(service)}` : ''}`);
    const data = await res.json();
    if ((logServiceById.get(id) || '') !== service) return; // filter changed meanwhile
    const firstLoad = !logCache.has(id);
    const logs = res.ok ? (data.logs || t('noOutputYet')) : (data.error || t('noOutputYet'));
    logCache.set(id, logs);
    const box = document.getElementById(`logBox-${id}`);
    if (box) {
      const wasAtBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 20;
      box.textContent = logs;
      if (wasAtBottom || firstLoad) box.scrollTop = box.scrollHeight;
    }
  } finally {
    logsInFlight.delete(id);
  }
}

function restoreLogScroll() {
  for (const [id, type] of expandedPanels) {
    if (type === 'logs') pollLogsFor(id);
  }
}

setInterval(whenVisible(restoreLogScroll), 2000);

// Collects the unique {label, command} pairs already defined across every
// project (excluding the current one's own list, which is shown separately),
// so the add-command form can suggest reusing one instead of retyping it.
function getAllKnownCommands(excludeProjectId) {
  const seen = new Set();
  const result = [];
  for (const proj of projects) {
    if (proj.id === excludeProjectId) continue;
    for (const c of proj.commands || []) {
      const key = `${c.label}\u0000${c.command}`;
      if (seen.has(key)) continue;
      seen.add(key);
      result.push({ label: c.label, command: c.command });
    }
  }
  return result;
}

// When the user picks a known command from the datalist, auto-fill the
// label field with the matching one instead of leaving it blank.
function onCommandInputPick(id, commandValue) {
  const draft = commandFormDraft.get(id) || { label: '', command: '' };
  if (draft.label) return; // don't overwrite something the user already typed
  const match = getAllKnownCommands(id).find(c => c.command === commandValue);
  if (match) {
    draft.label = match.label;
    commandFormDraft.set(id, draft);
    render();
  }
}

function updateCommandDraft(id, field, value) {
  const draft = commandFormDraft.get(id) || { label: '', command: '' };
