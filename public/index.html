// --- Git panel ---
const gitStatusCache = new Map(); // projectId -> { loading, data, error, selectedBranch, pushing, result }

function statusLabel(code) {
  const map = {
    'M': 'statusModified', 'A': 'statusAdded', 'D': 'statusDeleted', 'R': 'statusRenamed',
    'C': 'statusCopied', 'U': 'statusUnmerged', '??': 'statusUntracked',
  };
  return map[code] ? t(map[code]) : code;
}

async function loadGitStatus(id) {
  gitStatusCache.set(id, { loading: true });
  render();
  try {
    const res = await fetch(`/api/projects/${id}/git/status`);
    const data = await res.json();
    if (!res.ok) {
      gitStatusCache.set(id, { loading: false, error: data.error });
    } else if (!data.isRepo) {
      // Not a git repository at all (or no .git folder) - nothing further to compute.
      gitStatusCache.set(id, { loading: false, data });
    } else {
      const project = projects.find(x => x.id === id);
      const candidateMain = (project && project.defaultBranch && project.defaultBranch !== data.currentBranch)
        ? project.defaultBranch
        : data.branches.find(b => b !== data.currentBranch);
      gitStatusCache.set(id, {
        loading: false,
        data,
        selectedBranch: data.currentBranch,
        selectedMainBranch: candidateMain || data.currentBranch,
        selectedFiles: new Set(data.files.map(f => f.path)), // all checked by default
      });
    }
  } catch (e) {
    gitStatusCache.set(id, { loading: false, error: e.message });
  }
  render();
}

async function checkMainStatus(id) {
  const state = gitStatusCache.get(id);
  if (!state || !state.data) return;
  const select = document.getElementById(`mainBranchSelect-${id}`);
  const mainBranch = select ? select.value : state.selectedMainBranch;

  state.checkingMain = true;
  state.checkMainError = null;
  render();

  try {
    const res = await fetch(`/api/projects/${id}/git/check-main?mainBranch=${encodeURIComponent(mainBranch)}`);
    const result = await res.json();
    if (!res.ok) {
      state.checkMainError = result.error || t('checkMainFailed');
    } else {
      state.mainComparison = result;
    }
  } catch (e) {
    state.checkMainError = e.message;
  } finally {
    state.checkingMain = false;
    render();
  }
}

async function initGitRepo(id) {
  const state = gitStatusCache.get(id);
  if (!state) return;
  state.initializing = true;
  state.initError = null;
  render();
  try {
    const res = await fetch(`/api/projects/${id}/git/init`, { method: 'POST' });
    const data = await res.json();
    if (!res.ok) {
      state.initError = data.error || t('gitInitFailed');
      return;
    }
    await loadGitStatus(id);
  } catch (e) {
    state.initError = e.message;
  } finally {
    state.initializing = false;
    render();
  }
}

async function saveRemoteUrl(id) {
  const input = document.getElementById(`remoteUrlInput-${id}`);
  const url = input.value.trim();
  const state = gitStatusCache.get(id);
  if (!state) return;
  if (!url) {
    state.remoteError = t('remoteUrlRequired');
    render();
    return;
  }

  const wasEditingExisting = !!(state.data && state.data.remoteUrl);
  state.savingRemote = true;
  state.remoteError = null;
  state.remoteSuccess = null;
  render();

  try {
    const res = await fetch(`/api/projects/${id}/git/remote`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url }),
    });
    const data = await res.json();
    if (!res.ok) {
      state.remoteError = data.error || t('setRemoteFailed');
      return;
    }
    await fetchProjects();
    if (wasEditingExisting) {
      // Refresh status in the background but keep the confirmation visible
      // instead of resetting gitMode and closing the "remote" detail panel.
      const res2 = await fetch(`/api/projects/${id}/git/status`);
      const freshData = await res2.json();
      const refreshedState = gitStatusCache.get(id);
      if (refreshedState) {
        refreshedState.data = freshData;
        refreshedState.remoteUrlDraft = undefined;
        refreshedState.remoteSuccess = t('remoteUrlUpdated');
      }
    } else {
      await loadGitStatus(id);
    }
  } catch (e) {
    state.remoteError = e.message;
  } finally {
    const finalState = gitStatusCache.get(id);
    if (finalState) finalState.savingRemote = false;
    render();
  }
}

function toggleGitFile(id, filePath, checked) {
  const state = gitStatusCache.get(id);
  if (!state) return;
  if (checked) state.selectedFiles.add(filePath);
  else state.selectedFiles.delete(filePath);
  render();
}

function toggleAllGitFiles(id, checked) {
  const state = gitStatusCache.get(id);
  if (!state || !state.data) return;
  state.selectedFiles = checked ? new Set(state.data.files.map(f => f.path)) : new Set();
  render();
}

function setGitBranch(id, branch) {
  const state = gitStatusCache.get(id);
  if (!state) return;
  state.selectedBranch = branch;
}

function renderGitPanel(p) {
  const state = gitStatusCache.get(p.id);

  if (!state || state.loading) {
    return `<div class="inline-panel"><div class="env-empty">${t('loadingGitStatus')}</div></div>`;
  }

  if (state.error) {
    return `
      <div class="inline-panel">
        ${panelTitleWithClose(p.id, 'git', t('github'))}
        <div class="error-msg">${escapeHtml(state.error)}</div>
      </div>
    `;
  }

  const { data } = state;

  if (!data.isRepo) {
    return `
      <div class="inline-panel">
        ${panelTitleWithClose(p.id, 'git', t('github'))}
        <div class="modal-subtitle" style="margin-top:0">${t('notGitRepoSubtitle')}</div>
        ${state.initError ? `<div class="error-msg">${escapeHtml(state.initError)}</div>` : ''}
        <div class="modal-actions" style="justify-content:flex-start;">
          <button ${state.initializing ? 'disabled' : ''} onclick="initGitRepo('${p.id}')">${state.initializing ? t('initializing') : t('initializeGit')}</button>
        </div>
      </div>
    `;
  }

  if (!data.remoteUrl) {
    return `
      <div class="inline-panel">
        ${panelTitleWithClose(p.id, 'git', t('github'))}
        <div class="modal-subtitle" style="margin-top:0">${t('setRemoteSubtitle')}</div>
        <div class="field">
          <label>${t('remoteUrlLabel')}</label>
          <input id="remoteUrlInput-${p.id}" placeholder="git@github.com:user/repo.git" />
        </div>
        ${state.remoteError ? `<div class="error-msg">${escapeHtml(state.remoteError)}</div>` : ''}
        <div class="modal-actions" style="justify-content:flex-start;">
          <button onclick="saveRemoteUrl('${p.id}')">${t('setRemote')}</button>
        </div>
      </div>
    `;
  }

  const allChecked = data.files.length > 0 && data.files.every(f => state.selectedFiles.has(f.path));
  const someChecked = data.files.some(f => state.selectedFiles.has(f.path));

  const fileList = data.files.length
    ? data.files.map(f => `
        <label class="git-file-row">
          <input type="checkbox" ${state.selectedFiles.has(f.path) ? 'checked' : ''} onchange="toggleGitFile('${p.id}', '${escapeHtml(f.path).replace(/'/g, "\\'")}', this.checked)" />
          <span class="git-file-status status-${f.status.replace('?', 'untracked')}">${escapeHtml(statusLabel(f.status))}</span>
          <span class="git-file-path">${escapeHtml(f.path)}</span>
        </label>
      `).join('')
    : `<div class="env-empty">${t('noChanges')}</div>`;

  const branchOptions = data.branches.map(b =>
    `<option value="${escapeHtml(b)}" ${b === state.selectedBranch ? 'selected' : ''}>${escapeHtml(b)}</option>`
  ).join('');

  const mainBranchOptions = data.branches
    .filter(b => b !== data.currentBranch)
    .map(b => `<option value="${escapeHtml(b)}" ${b === state.selectedMainBranch ? 'selected' : ''}>${escapeHtml(b)}</option>`)
    .join('');

  const aheadBehind = [];
  if (data.ahead) aheadBehind.push(`${data.ahead} ${t('ahead')}`);
  if (data.behind) aheadBehind.push(`${data.behind} ${t('behind')}`);

  const mode = state.gitMode; // null | 'pull' | 'push'

  const pullDetail = mode === 'pull' ? `
    <div class="git-mode-detail">
      <div class="git-main-check-row">
        ${p.lastPulledAt ? `<span class="meta-item">${t('lastPulledFromMain')}: ${formatLastStarted(p.lastPulledAt)}</span>` : ''}
        ${state.checkingMain ? `<span class="meta-item">${t('checkingMain')}</span>` : ''}
        ${state.checkMainError ? `<div class="error-msg">${escapeHtml(state.checkMainError)}</div>` : ''}
        ${state.mainComparison ? `
          <div class="${state.mainComparison.upToDate ? 'git-success' : 'error-msg'}">
            ${state.mainComparison.upToDate
              ? t('upToDateWithMain', state.mainComparison.mainBranch)
              : t('behindMain', state.mainComparison.behind, state.mainComparison.mainBranch)}
            ${state.mainComparison.ahead ? ` (${t('aheadOfMain', state.mainComparison.ahead)})` : ''}
          </div>
        ` : ''}
      </div>
      ${state.pullError ? `<div class="error-msg">${escapeHtml(state.pullError)}</div>` : ''}
      ${state.pullSuccess ? `<div class="git-success">${escapeHtml(state.pullSuccess)}</div>` : ''}
      <div class="modal-actions" style="justify-content:flex-start;">
        <button ${(!mainBranchOptions || state.pulling) ? 'disabled' : ''} onclick="confirmPullFromMain('${p.id}')">${state.pulling ? t('pulling') : t('pullFromMaster')}</button>
      </div>
    </div>
  ` : '';

  const pushDetail = mode === 'push' ? `
    <div class="git-mode-detail">
      <div class="env-row-head" style="justify-content:space-between; display:flex;">
        <label class="git-select-all">
          <input type="checkbox" ${allChecked ? 'checked' : ''} ${data.files.length === 0 ? 'disabled' : ''} onchange="toggleAllGitFiles('${p.id}', this.checked)" />
          ${t('changesSelected', state.selectedFiles.size, data.files.length)}
        </label>
      </div>
      <div class="git-file-list">${fileList}</div>
      <div class="field" style="margin-bottom:12px;">
        <label>${t('commitMessageLabel')}</label>
        <input value="${escapeHtml(commitMessageFor(state))}" placeholder="${escapeHtml(t('commitMessagePlaceholder'))}" oninput="setCommitMessage('${p.id}', this.value)" />
      </div>
      ${state.result ? `<div class="git-success">${escapeHtml(state.result)}</div>` : ''}
      ${state.pushError ? `<div class="error-msg">${escapeHtml(state.pushError)}</div>` : ''}
      <div class="modal-actions" style="justify-content:space-between;">
        <button type="button" class="secondary small" onclick="loadGitStatus('${p.id}')">${t('refresh')}</button>
        <div style="display:flex; gap:8px;">
          ${(data.behind || state.pushRejected) ? `<button class="secondary" ${state.pushing ? 'disabled' : ''} onclick="pullAndPush('${p.id}')">${state.pushing && state.pullPushing ? t('pulling') : t('pullAndPush')}</button>` : ''}
          <button ${(!(someChecked || data.ahead) || state.pushing) ? 'disabled' : ''} onclick="confirmGitPush('${p.id}')">${state.pushing && !state.pullPushing ? t('pushing') : (someChecked ? t('commitAndPush') : t('pushCommits', data.ahead))}</button>
        </div>
      </div>
    </div>
  ` : '';

  const remoteDetail = mode === 'remote' ? `
    <div class="git-mode-detail">
      <div class="field">
        <label>${t('remoteUrlLabel')}</label>
        <input id="remoteUrlInput-${p.id}" value="${escapeHtml(state.remoteUrlDraft !== undefined ? state.remoteUrlDraft : data.remoteUrl || '')}" placeholder="git@github.com:user/repo.git" oninput="updateRemoteUrlDraft('${p.id}', this.value)" />
      </div>
      ${state.remoteError ? `<div class="error-msg">${escapeHtml(state.remoteError)}</div>` : ''}
      ${state.remoteSuccess ? `<div class="git-success">${escapeHtml(state.remoteSuccess)}</div>` : ''}
      <div class="modal-actions" style="justify-content:flex-start;">
        <button ${state.savingRemote ? 'disabled' : ''} onclick="saveRemoteUrl('${p.id}')">${state.savingRemote ? t('saving') : t('save')}</button>
      </div>
    </div>
  ` : '';

  return `
    <div class="inline-panel">
      ${panelTitleWithClose(p.id, 'git', t('github'))}
      <div class="git-branch-settings">
        <div class="field" style="margin-bottom:0;">
          <label>${t('currentBranchLabel')}</label>
          <select onchange="setGitBranch('${p.id}', this.value)">${branchOptions}</select>
        </div>
        <div class="field" style="margin-bottom:0;">
          <label>${t('mainBranchLabel')}</label>
          <select id="mainBranchSelect-${p.id}" ${mainBranchOptions ? '' : 'disabled'}>${mainBranchOptions || `<option>${escapeHtml(data.currentBranch)}</option>`}</select>
        </div>
        ${aheadBehind.length ? `<span class="badge">${aheadBehind.join(', ')}</span>` : ''}
      </div>

      <div class="git-mode-buttons">
        <button type="button" class="secondary ${mode === 'pull' ? 'panel-btn-active' : ''}" onclick="setGitMode('${p.id}', 'pull')">${t('pullFromMaster')}</button>
        <button type="button" class="secondary ${mode === 'push' ? 'panel-btn-active' : ''}" onclick="setGitMode('${p.id}', 'push')">${t('pushCommitChanges')}</button>
        <button type="button" class="secondary ${mode === 'remote' ? 'panel-btn-active' : ''}" onclick="setGitMode('${p.id}', 'remote')">${t('remoteSettings')}</button>
      </div>

      ${pullDetail}
      ${pushDetail}
      ${remoteDetail}
    </div>
  `;
}

function updateRemoteUrlDraft(id, value) {
  const state = gitStatusCache.get(id);
  if (!state) return;
  state.remoteUrlDraft = value;
}

function setGitMode(id, mode) {
  const state = gitStatusCache.get(id);
  if (!state) return;
  state.gitMode = state.gitMode === mode ? null : mode;
  render();
  if (state.gitMode === 'pull') checkMainStatus(id);
}

async function confirmPullFromMain(id) {
  const state = gitStatusCache.get(id);
  if (!state || !state.data) return;
  const select = document.getElementById(`mainBranchSelect-${id}`);
  const mainBranch = select.value;
  const currentBranch = state.data.currentBranch;

  const confirmed = await showConfirm(t('confirmPullFromMain', mainBranch, currentBranch));
  if (!confirmed) return;

  state.pulling = true;
  state.pullError = null;
  state.pullSuccess = null;
  render();

  try {
    const res = await fetch(`/api/projects/${id}/git/pull-main`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mainBranch, currentBranch }),
    });
    const result = await res.json();
    if (!res.ok) {
      state.pullError = result.error || t('pullFromMainFailed');
    } else {
      // Refresh the underlying git data in the background, but keep this
      // same state object (with pullSuccess set) instead of calling
      // loadGitStatus() - that replaces the whole state and would wipe out
      // the success message before the user ever sees it.
      const res2 = await fetch(`/api/projects/${id}/git/status`);
      const freshData = await res2.json();
      state.data = freshData;
      state.selectedFiles = new Set((freshData.files || []).map(f => f.path));
      state.pullSuccess = t('pullFromMainSuccess', mainBranch, currentBranch);
      await fetchProjects();
    }
  } catch (e) {
    state.pullError = e.message;
  } finally {
    state.pulling = false;
    render();
  }
}

// Empty unless the user typed one; pushes fall back to "Update".
function commitMessageFor(state) {
  return state.message || '';
}

function setCommitMessage(id, value) {
  const state = gitStatusCache.get(id);
  if (!state) return;
  state.message = value;
}

async function confirmGitPush(id) {
  const state = gitStatusCache.get(id);
  if (!state || !state.data) return;
  const { data, selectedBranch, selectedFiles } = state;

  const selectedFileList = data.files.filter(f => selectedFiles.has(f.path));
  const pushOnly = selectedFileList.length === 0;
  if (pushOnly && !data.ahead) return;

  const message = commitMessageFor(state).trim() || 'Update';
  const fileListText = selectedFileList.map(f => `  ${statusLabel(f.status)}: ${f.path}`).join('\n');
  const confirmed = await showConfirm(pushOnly
    ? t('confirmPushOnly', data.ahead, selectedBranch)
    : `${t('confirmPushTitle', selectedBranch)}\n\n` +
      `${t('confirmPushFiles', selectedFileList.length)}\n${fileListText}\n\n` +
      `${t('confirmPushAutoMessage', message)}`
  );
  if (!confirmed) return;

  state.pushing = true;
  state.pushError = null;
  state.result = null;
  render();

  try {
    const res = await fetch(`/api/projects/${id}/git/push`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ branch: selectedBranch, files: selectedFileList.map(f => f.path), message }),
    });
    const result = await res.json();
    if (!res.ok) {
      // The commit may have gone through even though the push failed, so
      // reload the file list (otherwise a retry resends stale paths) and keep
      // showing the error on the refreshed panel.
      await reloadGitStatusKeeping(id, { pushError: result.error || t('pushFailed'), pushRejected: result.pushRejected });
      return;
    }
    await reloadGitStatusKeeping(id, { result: result.committed ? t('pushSuccess', result.branch, result.message) : t('pushOnlySuccess', result.branch) });
    return;
  } catch (e) {
    state.pushError = e.message;
  } finally {
    state.pushing = false;
    render();
  }
}

async function reloadGitStatusKeeping(id, fields) {
  await loadGitStatus(id);
  const fresh = gitStatusCache.get(id);
  if (fresh) Object.assign(fresh, fields);
  render();
}

async function pullAndPush(id) {
  const state = gitStatusCache.get(id);
  if (!state || !state.data || state.pushing) return;
  if (!(await showConfirm(t('confirmPullPush', state.selectedBranch)))) return;
  state.pushing = true;
  state.pullPushing = true;
  state.pushError = null;
  state.result = null;
  render();
  try {
    const res = await fetch(`/api/projects/${id}/git/pull-push`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ branch: state.selectedBranch }),
    });
    const result = await res.json();
    await reloadGitStatusKeeping(id, res.ok
      ? { result: t('pullPushSuccess', result.branch) }
      : { pushError: result.error || t('pushFailed'), pushRejected: !result.isConflict });
    return;
  } catch (e) {
    state.pushError = e.message;
  } finally {
    state.pushing = false;
    state.pullPushing = false;
    render();
  }
}

async function reloadCaddy() {
  const btn = document.getElementById('reloadCaddyBtn');
  if (btn.disabled) return;
  btn.disabled = true;
  const originalHtml = btn.innerHTML;
  btn.innerHTML = `${icon('refresh')}<span>${t('reloading')}</span>`;
  try {
    const res = await fetch('/api/caddy/reload', { method: 'POST' });
    const data = await res.json();
    await showAlert(data.message + (data.hostsOk === false ? `\n\n${data.hostsMessage}` : ''));
    await checkCaddyStatus();
  } finally {
    btn.disabled = false;
    btn.innerHTML = originalHtml;
  }
}

let caddyInstalling = false;

let caddyAlertShownFor = null; // tracks which problem we've already popped up, so we don't nag on every 4s poll

async function checkCaddyStatus() {
  const res = await fetch('/api/caddy/status');
  const data = await res.json();
  const el = document.getElementById('caddyStatus');
  if (data.installed) {
    el.innerHTML = `<span class="cdot"></span>${t('caddyInstalled')}`;
    el.classList.remove('caddy-missing');
    el.onclick = null;
    caddyAlertShownFor = null;
  } else {
    const problemKey = data.needsRestart ? 'needsRestart' : 'notInstalled';
    const label = data.needsRestart ? t('caddyNeedsRestart') : t('caddyNotInstalled');
    el.innerHTML = `<span class="cdot" style="background:var(--red)"></span>${label}`;
    el.classList.add('caddy-missing');
    el.onclick = () => handleCaddyMissing(data.needsRestart);

    if (caddyAlertShownFor !== problemKey) {
      caddyAlertShownFor = problemKey;
      handleCaddyMissing(data.needsRestart);
    }
  }
}

async function handleCaddyMissing(needsRestart) {
  if (needsRestart) {
    await showAlert(t('caddyRestartInstructions'));
    return;
  }
  const confirmed = await showConfirm(t('caddyInstallConfirm'));
  if (!confirmed) return;
  installCaddy();
}

async function installCaddy() {
  if (caddyInstalling) return;
  caddyInstalling = true;
  const el = document.getElementById('caddyStatus');
  el.innerHTML = `<span class="cdot" style="background:var(--yellow)"></span>${t('caddyInstalling')}`;
  try {
    const res = await fetch('/api/caddy/install', { method: 'POST' });
    const data = await res.json();
    if (!res.ok) {
      await showAlert(`${t('caddyInstallFailed')}\n\n${data.error}`);
    } else {
      await showAlert(t('caddyRestartInstructions'));
    }
  } catch (e) {
    await showAlert(`${t('caddyInstallFailed')}\n\n${e.message}`);
  } finally {
    caddyInstalling = false;
    checkCaddyStatus();
  }
}

// --- System services sidebar ---
const servicePending = new Set();

async function loadServices() {
  try {
    const res = await fetch('/api/services');
    const data = await res.json();
    renderServices(data);
  } catch (e) {
    document.getElementById('servicesList').innerHTML = `<div class="services-empty">${t('servicesLoadFailed')}</div>`;
  }
}

function renderServices(data) {
  const { services, runtimes } = data;

  const serviceRows = services.length
    ? services.map(s => {
        const busy = servicePending.has(s.serviceName);
        const label = busy ? (s.running ? t('stopping') : t('starting')) : (s.running ? t('stop') : t('start'));
        return `
          <div class="service-row">
            <div class="service-info">
              <span class="service-name">${escapeHtml(s.label)}</span>
              <span class="service-sub">${s.running ? t('running') : t('stopped')}</span>
            </div>
            <button class="service-toggle ${s.running ? 'on' : 'off'}" ${busy ? 'disabled' : ''}
              onclick="toggleService('${escapeHtml(s.serviceName)}', ${s.running})">${label}</button>
          </div>
        `;
      }).join('')
    : `<div class="services-empty">${t('noServicesFound')}</div>`;

  const runtimeRows = runtimes.map(r => `
    <div class="runtime-row">
      <span class="runtime-name">${escapeHtml(r.label)}</span>
      <span class="runtime-version">${r.installed ? escapeHtml(r.version) : t('notInstalledShort')}</span>
    </div>
  `).join('');

  document.getElementById('servicesList').innerHTML = `
    ${serviceRows}
    <hr class="services-divider" />
    ${runtimeRows}
  `;
}

async function toggleService(serviceName, currentlyRunning) {
  if (servicePending.has(serviceName)) return;
  servicePending.add(serviceName);
  await loadServices();
  try {
    const action = currentlyRunning ? 'stop' : 'start';
    const res = await fetch(`/api/services/${encodeURIComponent(serviceName)}/${action}`, { method: 'POST' });
    const data = await res.json();
    if (!res.ok) {
      await showAlert(data.error || t('serviceActionFailed'));
    }
  } catch (e) {
    await showAlert(e.message);
  } finally {
    servicePending.delete(serviceName);
    await loadServices();
  }
}

// --- Edit Hosts page ---
// Routed via location.hash (#hosts) so the browser Back button works.
const hostsState = {
  data: null,
  loading: false,
  error: null,
  busy: false,
  filter: '',
  editingLine: null,
  editDraft: null,
  addDraft: { ip: '127.0.0.1', hostnames: '', comment: '' },
};

function isHostsPage() {
  return location.hash === '#hosts';
}

function applyRoute() {
  const onHosts = isHostsPage();
  document.body.classList.toggle('page-hosts', onHosts);
  if (onHosts) loadHosts();
}

window.addEventListener('hashchange', applyRoute);

async function loadHosts() {
  hostsState.loading = true;
  renderHostsPage();
  try {
    const res = await fetch('/api/hosts');
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || t('hostsLoadFailed'));
    hostsState.data = data;
    hostsState.error = null;
  } catch (e) {
    hostsState.error = `${t('hostsLoadFailed')}: ${e.message}`;
  } finally {
    hostsState.loading = false;
    renderHostsPage();
  }
}

// Runs a mutating request; the server replies with the fresh entry list.
async function hostsRequest(method, url, body) {
  if (hostsState.busy) return false;
  hostsState.busy = true;
  renderHostsPage();
  try {
    const res = await fetch(url, {
      method,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) {
      await showAlert(data.error || t('hostsSaveFailed'));
      return false;
    }
    hostsState.data = data;
    return true;
  } catch (e) {
    await showAlert(`${t('hostsSaveFailed')}\n\n${e.message}`);
    return false;
  } finally {
    hostsState.busy = false;
    renderHostsPage();
  }
}

function findHostsEntry(line) {
  return hostsState.data && hostsState.data.entries.find(e => e.line === line);
}

async function addHostsEntry() {
  const d = hostsState.addDraft;
  const ok = await hostsRequest('POST', '/api/hosts/entries', { ip: d.ip, hostnames: d.hostnames, comment: d.comment, enabled: true });
  if (ok) {
    hostsState.addDraft = { ip: d.ip, hostnames: '', comment: '' };
    renderHostsPage();
  }
}

function startEditHostsEntry(line) {
  const entry = findHostsEntry(line);
  if (!entry) return;
  hostsState.editingLine = line;
  hostsState.editDraft = { ip: entry.ip, hostnames: entry.hostnames.join(' '), comment: entry.comment };
  renderHostsPage();
}

function cancelEditHostsEntry() {
  hostsState.editingLine = null;
  hostsState.editDraft = null;
  renderHostsPage();
}

async function saveHostsEntry(line) {
  const entry = findHostsEntry(line);
  if (!entry) return;
  const d = hostsState.editDraft;
  const ok = await hostsRequest('PUT', `/api/hosts/entries/${line}`, { raw: entry.raw, ip: d.ip, hostnames: d.hostnames, comment: d.comment, enabled: entry.enabled });
  if (ok) cancelEditHostsEntry();
}

async function toggleHostsEntry(line, enabled) {
  const entry = findHostsEntry(line);
  if (!entry) return;
  await hostsRequest('PUT', `/api/hosts/entries/${line}`, { raw: entry.raw, ip: entry.ip, hostnames: entry.hostnames, comment: entry.comment, enabled });
}

async function deleteHostsEntry(line) {
  const entry = findHostsEntry(line);
  if (!entry) return;
  const confirmed = await showConfirm(t('hostsConfirmDelete', `${entry.ip} ${entry.hostnames.join(' ')}`));
  if (!confirmed) return;
  const ok = await hostsRequest('DELETE', `/api/hosts/entries/${line}`, { raw: entry.raw });
  // Line numbers shift after a delete, so drop any in-progress edit.
  if (ok) cancelEditHostsEntry();
}

function filteredHostsEntries() {
  const all = hostsState.data ? hostsState.data.entries : [];
  const q = hostsState.filter.trim().toLowerCase();
  if (!q) return all;
  return all.filter(e =>
    e.ip.toLowerCase().includes(q) ||
    e.hostnames.some(h => h.toLowerCase().includes(q)) ||
    e.comment.toLowerCase().includes(q));
}

// Only re-renders the list, so typing in the filter box keeps focus.
function setHostsFilter(value) {
  hostsState.filter = value;
  document.getElementById('hostsList').innerHTML = renderHostsList();
  document.getElementById('hostsCount').textContent = t('hostsCount', filteredHostsEntries().length, hostsState.data.entries.length);
}

function renderHostsList() {
  const entries = filteredHostsEntries();
  if (!entries.length) return `<div class="hosts-empty">${t('hostsEmpty')}</div>`;

  const busy = hostsState.busy ? 'disabled' : '';
  return entries.map(e => {
    if (hostsState.editingLine === e.line) {
      const d = hostsState.editDraft;
      return `
        <div class="hosts-row">
          <input class="h-ip" value="${escapeHtml(d.ip)}" placeholder="${t('hostsIp')}" oninput="hostsState.editDraft.ip = this.value" />
          <input class="h-hosts" value="${escapeHtml(d.hostnames)}" placeholder="${t('hostsHostnames')}" oninput="hostsState.editDraft.hostnames = this.value" onkeydown="if (event.key === 'Enter') saveHostsEntry(${e.line})" />
          <input class="h-comment" value="${escapeHtml(d.comment)}" placeholder="${t('hostsComment')}" oninput="hostsState.editDraft.comment = this.value" onkeydown="if (event.key === 'Enter') saveHostsEntry(${e.line})" />
          <div class="h-actions">
            <button class="secondary small" onclick="cancelEditHostsEntry()">${t('cancel')}</button>
            <button class="small" ${busy} onclick="saveHostsEntry(${e.line})">${t('save')}</button>
          </div>
        </div>
      `;
    }
    const actions = e.managed
      ? `<span class="badge" title="${escapeHtml(t('hostsManagedHint'))}">${t('hostsManagedBadge')}</span>`
      : `
        <button class="secondary small" ${busy} onclick="startEditHostsEntry(${e.line})">${t('edit')}</button>
        <button class="danger small" ${busy} onclick="deleteHostsEntry(${e.line})">${t('delete')}</button>
      `;
    return `
      <div class="hosts-row ${e.enabled ? '' : 'disabled'}">
        <input type="checkbox" class="h-toggle" title="${escapeHtml(t('hostsToggleHint'))}" ${e.enabled ? 'checked' : ''} ${e.managed || hostsState.busy ? 'disabled' : ''} onchange="toggleHostsEntry(${e.line}, this.checked)" />
        <span class="h-text h-ip">${escapeHtml(e.ip)}</span>
        <span class="h-text h-hosts">${escapeHtml(e.hostnames.join(' '))}</span>
        <span class="h-text h-comment">${e.comment ? '# ' + escapeHtml(e.comment) : ''}</span>
        <div class="h-actions">${actions}</div>
      </div>
    `;
  }).join('');
}

function renderHostsPage() {
  if (!isHostsPage()) return;
  const d = hostsState.addDraft;
  const busy = hostsState.busy ? 'disabled' : '';
  const data = hostsState.data;

  let body;
  if (hostsState.error) body = `<div class="error-msg">${escapeHtml(hostsState.error)}</div>`;
  else if (!data) body = `<div class="hosts-empty">${t('hostsLoading')}</div>`;
  else body = `<div id="hostsList">${renderHostsList()}</div>`;

  document.getElementById('hostsPage').innerHTML = `
    <div class="hosts-header">
      <button class="secondary small" onclick="location.hash = ''">${t('back')}</button>
      <h2>${t('hostsTitle')}</h2>
      <span class="hosts-path">${data ? escapeHtml(data.path) : ''}</span>
    </div>

    <div class="hosts-card">
      <div class="hosts-card-title">${t('hostsAddTitle')}</div>
      <div class="hosts-form">
        <input class="h-ip" value="${escapeHtml(d.ip)}" placeholder="${t('hostsIp')}" oninput="hostsState.addDraft.ip = this.value" />
        <input class="h-hosts" value="${escapeHtml(d.hostnames)}" placeholder="${t('hostsHostnames')}" oninput="hostsState.addDraft.hostnames = this.value" onkeydown="if (event.key === 'Enter') addHostsEntry()" />
        <input class="h-comment" value="${escapeHtml(d.comment)}" placeholder="${t('hostsComment')}" oninput="hostsState.addDraft.comment = this.value" onkeydown="if (event.key === 'Enter') addHostsEntry()" />
        <button ${busy} onclick="addHostsEntry()">${t('hostsAdd')}</button>
      </div>
      <div class="hosts-note">${t('hostsNote')}</div>
    </div>

    <div class="hosts-card">
      <div class="hosts-toolbar">
        <div class="hosts-card-title" style="margin:0">
          ${t('hostsEntriesTitle')}
          <span id="hostsCount" style="text-transform:none; font-weight:500">${data ? t('hostsCount', filteredHostsEntries().length, data.entries.length) : ''}</span>
        </div>
        <div style="display:flex; gap:8px;">
          <input class="hosts-filter" value="${escapeHtml(hostsState.filter)}" placeholder="${t('hostsFilter')}" oninput="setHostsFilter(this.value)" />
          <button class="secondary small" ${hostsState.loading ? 'disabled' : ''} onclick="loadHosts()">${t('refresh')}</button>
        </div>
      </div>
      ${body}
    </div>
  `;
}

applyRoute();

Promise.all([fetchProjects(), checkCaddyStatus(), checkDockerStatus(true), loadServices()]).finally(() => {
  document.getElementById('pageLoading').classList.add('hidden');
});
// Polls pause while the window is hidden (e.g. closed to the tray) and catch
// up as soon as it's shown again, so an idle lotwork spawns nothing. Services
// (a PowerShell spawn) aren't polled at all - they refresh on load, after a
// start/stop, and from the sidebar / Sync buttons.
function whenVisible(fn) {
  return () => { if (!document.hidden) fn(); };
}

setInterval(whenVisible(() => fetchProjects(true)), 4000);
setInterval(whenVisible(() => checkDockerStatus()), 10000);

document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  fetchProjects(true);
  checkDockerStatus();
});

async function refreshServices() {
  const btn = document.getElementById('servicesRefreshBtn');
  if (btn.disabled) return;
  btn.disabled = true;
  btn.classList.add('spinning');
  try {
    await loadServices();
  } finally {
    btn.disabled = false;
    btn.classList.remove('spinning');
  }
}

async function syncAll() {
  const btn = document.getElementById('syncBtn');
  if (btn.disabled) return;
  btn.disabled = true;
  try {
    await fetch('/api/sync', { method: 'POST' });
    await Promise.all([fetchProjects(), checkDockerStatus(true), refreshServices()]);
  } catch (e) {
    await showAlert(e.message);
  } finally {
    btn.disabled = false;
  }
}
</script>

</body>
</html>
