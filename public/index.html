<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>LotWork</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<style>
  :root {
    --bg: #0b0d13;
    --bg-2: #11141c;
    --panel: #171b26;
    --panel-2: #1e2330;
    --panel-3: #262c3d;
    --border: #2b3244;
    --border-soft: #1f2432;
    --text: #f2f4f8;
    --muted: #9aa3b8;
    --muted-2: #666f85;
    --accent: #7c6ef4;
    --accent-2: #5b8cff;
    --accent-hover: #8f83ff;
    --accent-soft: rgba(124, 110, 244, 0.16);
    --pink: #f065b0;
    --pink-soft: rgba(240, 101, 176, 0.14);
    --green: #3ddb96;
    --green-soft: rgba(61, 219, 150, 0.14);
    --red: #ff6767;
    --red-soft: rgba(255, 103, 103, 0.14);
    --yellow: #f3c14b;
    --yellow-soft: rgba(243, 193, 75, 0.14);
    --radius: 16px;
    --radius-sm: 10px;
    --shadow: 0 10px 40px rgba(0,0,0,0.35);
  }

  :root[data-theme="light"] {
    --bg: #f3f4f9;
    --bg-2: #eaecf4;
    --panel: #ffffff;
    --panel-2: #f4f5fa;
    --panel-3: #eaecf5;
    --border: #e1e3ee;
    --border-soft: #ececf3;
    --text: #1c1f2b;
    --muted: #6b7288;
    --muted-2: #9096a8;
    --accent-soft: rgba(124, 110, 244, 0.12);
    --pink-soft: rgba(240, 101, 176, 0.12);
    --green-soft: rgba(16, 163, 96, 0.12);
    --green: #12a866;
    --red-soft: rgba(230, 60, 60, 0.1);
    --red: #e13c3c;
    --yellow-soft: rgba(200, 140, 10, 0.12);
    --yellow: #b8860b;
    --shadow: 0 10px 30px rgba(30,35,60,0.08);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(900px 500px at 100% -10%, var(--accent-soft), transparent),
      radial-gradient(700px 400px at -10% 30%, var(--pink-soft), transparent),
      var(--bg);
    color: var(--text);
    font-family: "Segoe UI", -apple-system, Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    transition: background 0.2s ease, color 0.2s ease;
  }

  header {
    padding: 20px 32px;
    border-bottom: 1px solid var(--border-soft);
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    background: color-mix(in srgb, var(--bg) 80%, transparent);
    backdrop-filter: blur(14px);
    z-index: 10;
  }
  header .brand { display: flex; align-items: center; gap: 12px; }
  header .logo {
    width: 36px; height: 36px; border-radius: 11px;
    background: linear-gradient(135deg, var(--accent), var(--pink));
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 17px; color: white;
    box-shadow: 0 4px 16px rgba(124,110,244,0.4);
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 700; letter-spacing: 0.2px; }
  header .sub { color: var(--muted-2); font-size: 11.5px; margin-top: 1px; }
  header .right { display: flex; align-items: center; gap: 12px; }

  .theme-toggle {
    display: flex; align-items: center; gap: 4px; background: var(--panel-2);
    border: 1px solid var(--border); border-radius: 999px; padding: 4px; cursor: pointer;
    position: relative;
  }
  .theme-toggle button {
    background: transparent; border: none; padding: 6px 10px; font-size: 14px;
    border-radius: 999px; cursor: pointer; color: var(--muted-2); box-shadow: none;
    display: flex; align-items: center; justify-content: center; min-width: 30px;
  }
  .theme-toggle button.active { background: var(--panel-3); color: var(--text); }

  .lang-toggle {
    display: flex; align-items: center; gap: 4px; background: var(--panel-2);
    border: 1px solid var(--border); border-radius: 999px; padding: 4px;
  }
  .lang-toggle button {
    background: transparent; border: none; padding: 6px 10px; font-size: 11px; font-weight: 700;
    border-radius: 999px; cursor: pointer; color: var(--muted-2); box-shadow: none; min-width: 30px;
  }
  .lang-toggle button.active { background: var(--panel-3); color: var(--text); }

  main { padding: 28px 32px 60px; max-width: 1440px; margin: 0 auto; }

  .main-layout { display: flex; gap: 24px; align-items: flex-start; }
  .main-content { flex: 1; min-width: 0; }
  .services-sidebar {
    flex: 0 0 260px; background: var(--panel); border: 1px solid var(--border-soft);
    border-radius: var(--radius); padding: 18px; position: sticky; top: 96px;
  }
  .sidebar-title {
    font-size: 12.5px; font-weight: 700; color: var(--muted); margin-bottom: 14px;
    text-transform: uppercase; letter-spacing: 0.6px;
  }
  .service-row {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 10px 0; border-bottom: 1px solid var(--border-soft);
  }
  .service-row:last-child { border-bottom: none; }
  .service-info { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .service-name { font-size: 13px; font-weight: 600; color: var(--text); }
  .service-sub { font-size: 11px; color: var(--muted-2); }
  .service-toggle {
    flex-shrink: 0; padding: 5px 12px; font-size: 11px; border-radius: 999px; font-weight: 600;
    box-shadow: none;
  }
  .service-toggle.on { background: var(--red-soft); color: var(--red); }
  .service-toggle.off { background: var(--green-soft); color: var(--green); }
  .service-toggle:disabled { opacity: 0.5; }
  .services-empty { font-size: 12px; color: var(--muted-2); padding: 8px 0; }
  .runtime-row {
    display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 0;
  }
  .runtime-name { font-size: 12.5px; color: var(--text); }
  .runtime-version { font-size: 11px; color: var(--muted-2); font-family: "Cascadia Code", Consolas, monospace; }
  .services-divider { border: none; border-top: 1px solid var(--border-soft); margin: 14px 0; }

  @media (max-width: 980px) {
    .main-layout { flex-direction: column; }
    .services-sidebar { flex: 1 1 auto; width: 100%; position: static; }
  }

  .toolbar { display: flex; gap: 12px; margin-bottom: 24px; align-items: center; flex-wrap: wrap; }

  button {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: transform 0.12s ease, box-shadow 0.12s ease, opacity 0.12s ease;
    box-shadow: 0 4px 14px rgba(124,110,244,0.3);
  }
  button:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(124,110,244,0.4); }
  button:active:not(:disabled) { transform: translateY(0); }
  button.secondary {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    box-shadow: none;
  }
  button.secondary:hover:not(:disabled) { background: var(--panel-3); box-shadow: none; transform: none; }
  button.success { background: linear-gradient(135deg, var(--green), #2bb583); box-shadow: 0 4px 14px rgba(61,219,150,0.3); }
  button.danger { background: var(--red-soft); color: var(--red); box-shadow: none; }
  button.danger:hover:not(:disabled) { background: rgba(255,103,103,0.22); transform: none; box-shadow: none; }
  button.ghost { background: transparent; color: var(--muted); box-shadow: none; padding: 12px 18px; }
  button.ghost:hover:not(:disabled) { background: var(--panel-2); color: var(--text); transform: none; box-shadow: none; }
  button.small { padding: 8px 14px; font-size: 12.5px; border-radius: 8px; }
  button:disabled { opacity: 0.45; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

  .project-grid { display: flex; flex-direction: column; gap: 14px; }

  .project-card {
    background: var(--panel);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    padding: 20px 22px;
    box-shadow: var(--shadow);
    transition: border-color 0.15s ease, transform 0.15s ease;
    position: relative;
    overflow: hidden;
  }
  .project-card::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
    background: var(--muted-2); opacity: 0.3;
  }
  .project-card.running::before { background: linear-gradient(var(--green), var(--accent)); opacity: 1; }
  .self-card::before { background: linear-gradient(var(--pink), var(--accent)); opacity: 1; }
  .self-badge { background: var(--accent-soft); color: var(--accent); }
  .project-card:hover { border-color: var(--border); }

  .project-top {
    display: flex; justify-content: space-between; align-items: flex-start;
    margin-bottom: 14px; flex-wrap: wrap; gap: 10px;
  }
  .project-info { display: flex; flex-direction: column; gap: 6px; }
  .project-name-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .proj-name { font-weight: 700; font-size: 15.5px; }
  .repo-link {
    display: inline-flex; align-items: center; gap: 5px; color: var(--muted-2); text-decoration: none;
    font-size: 11.5px; margin-top: 2px; margin-bottom: 8px; font-family: "Cascadia Code", Consolas, monospace;
  }
  .repo-link::before { content: "\1F517"; font-size: 11px; }
  .repo-link:hover { color: var(--accent); text-decoration: underline; }
  .repo-link.no-remote { color: var(--red); cursor: default; }
  .repo-link.no-remote:hover { text-decoration: none; color: var(--red); }
  .last-commit {
    font-size: 11.5px; color: var(--muted-2); margin-bottom: 6px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%;
  }
  .branch-info { font-size: 11.5px; color: var(--muted-2); }
  .branch-info code {
    background: var(--panel-2); padding: 2px 7px; border-radius: 5px;
    font-size: 11px; color: var(--accent-2); font-family: "Cascadia Code", Consolas, monospace;
  }
  .branch-vs { color: var(--muted-2); }
  .branch-changes-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
  .changes-badge {
    background: var(--yellow-soft); color: var(--yellow); font-weight: 700; cursor: default;
  }
  .project-meta { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; font-size: 12.5px; color: var(--muted); }
  .project-meta .meta-item { display: flex; align-items: center; gap: 5px; }
  .project-meta code {
    background: var(--panel-2); padding: 3px 8px; border-radius: 6px;
    font-size: 12px; color: var(--accent-2); font-family: "Cascadia Code", Consolas, monospace;
  }

  .status-pill {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 6px 12px 6px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600;
    flex-shrink: 0;
  }
  .status-pill.on { background: var(--green-soft); color: var(--green); }
  .status-pill.off { background: var(--panel-2); color: var(--muted); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
  .dot.on { background: var(--green); box-shadow: 0 0 10px var(--green); animation: pulse 2s infinite; }
  .dot.off { background: var(--muted-2); }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }

  .empty-state {
    padding: 70px 20px; text-align: center; color: var(--muted-2);
    background: var(--panel); border: 1px dashed var(--border); border-radius: var(--radius);
    font-size: 14px; line-height: 1.8;
  }

  .modal-bg {
    display: none; position: fixed; inset: 0; background: rgba(6, 7, 12, 0.65);
    align-items: center; justify-content: center; backdrop-filter: blur(4px);
    z-index: 100;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: var(--panel); border: 1px solid var(--border); border-radius: 20px;
    padding: 28px; width: 460px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.45);
    max-height: 88vh; overflow-y: auto;
  }
  .modal h2 { margin: 0 0 18px; font-size: 18px; font-weight: 700; }
  .dialog-modal { width: 400px; }
  .dialog-message { font-size: 13.5px; color: var(--text); line-height: 1.6; white-space: pre-line; }
  .dialog-modal.alert-only #dialogCancelBtn { display: none; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 7px; font-weight: 600; }
  .field input, .field select {
    width: 100%; padding: 11px 13px; border-radius: var(--radius-sm); border: 1.5px solid var(--border);
    background: var(--bg-2); color: var(--text); font-size: 13.5px; transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .field input:focus, .field select:focus {
    outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .domain-input {
    display: flex; align-items: center; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
    background: var(--bg-2); overflow: hidden; transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .domain-input:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .domain-input input { border: none; background: transparent; flex: 1; box-shadow: none !important; }
  .domain-input input:focus { outline: none; }
  .domain-suffix { padding: 11px 13px 11px 0; color: var(--muted-2); font-size: 13.5px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }
  .badge {
    font-size: 11px; padding: 4px 10px; border-radius: 999px; background: var(--panel-2);
    color: var(--muted); font-weight: 600;
  }
  a.domain-link { color: var(--accent-2); text-decoration: none; font-weight: 600; }
  a.domain-link:hover { text-decoration: underline; }
  .modal-subtitle { color: var(--muted-2); font-size: 12.5px; margin: -12px 0 20px; line-height: 1.5; }
  .modal-subtitle code { background: var(--panel-2); padding: 1px 5px; border-radius: 4px; }

  .panel-btn-active { background: var(--accent-soft) !important; color: var(--accent) !important; border-color: transparent !important; }

  .inline-panel {
    margin-top: 16px; padding-top: 16px; border-top: 1px dashed var(--border);
    animation: panel-in 0.15s ease;
  }
  @keyframes panel-in {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .inline-panel-title {
    font-size: 12.5px; font-weight: 700; color: var(--muted); margin-bottom: 12px;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .log-box {
    background: var(--bg-2); padding: 14px; border-radius: var(--radius-sm); height: 260px; overflow: auto;
    font-size: 12.5px; line-height: 1.6; white-space: pre-wrap; word-break: break-all;
    font-family: "Cascadia Code", Consolas, monospace; border: 1px solid var(--border-soft); margin: 0;
  }

  #envRows { max-height: 380px; overflow-y: auto; margin-bottom: 14px; padding-right: 4px; }
  #envRows::-webkit-scrollbar { width: 8px; }
  #envRows::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .env-row-head {
    display: flex; gap: 8px; padding: 0 4px 8px; font-size: 10.5px; font-weight: 700;
    color: var(--muted-2); text-transform: uppercase; letter-spacing: 0.6px;
  }
  .env-row-head .col-key { flex: 0 0 34%; }
  .env-row-head .col-value { flex: 1; }
  .env-row {
    display: flex; gap: 8px; margin-bottom: 8px; align-items: center;
    background: var(--bg-2); border: 1.5px solid var(--border-soft); border-radius: var(--radius-sm);
    padding: 7px; transition: border-color 0.15s ease;
  }
  .env-row:focus-within { border-color: var(--accent); }
  .env-row input.env-key, .env-row input.env-value {
    background: transparent; border: none; color: var(--text);
    font-family: "Cascadia Code", Consolas, monospace; font-size: 12.5px; padding: 5px 7px;
  }
  .env-row input.env-key { flex: 0 0 34%; color: var(--accent-2); border-right: 1px solid var(--border-soft); border-radius: 0; }
  .env-row input.env-value { flex: 1; }
  .env-row input:focus { outline: none; box-shadow: none; }
  .env-row .source-badge {
    flex-shrink: 0; font-size: 9.5px; font-weight: 700; padding: 3px 8px; border-radius: 5px;
    text-transform: uppercase; letter-spacing: 0.3px; white-space: nowrap; cursor: pointer;
  }
  .env-row .source-badge.env { background: var(--accent-soft); color: var(--accent); }
  .env-row .source-badge.env-local { background: var(--green-soft); color: var(--green); }
  .env-row button.remove-row {
    flex-shrink: 0; background: transparent; color: var(--muted-2); padding: 5px 9px; font-size: 16px;
    border: none; border-radius: 6px; line-height: 1; box-shadow: none;
  }
  .env-row button.remove-row:hover { background: var(--red-soft); color: var(--red); transform: none; box-shadow: none; }
  .env-empty { color: var(--muted-2); font-size: 12.5px; padding: 28px 0; text-align: center; }
  .env-footer { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .env-legend { display: flex; gap: 14px; font-size: 11.5px; color: var(--muted-2); align-items: center; }
  .env-legend .source-badge { position: relative; top: -1px; cursor: default; }

  #credentialsList { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; max-height: 320px; overflow-y: auto; }
  .cred-card {
    background: var(--bg-2); border: 1.5px solid var(--border-soft); border-radius: var(--radius-sm);
    padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px;
  }
  .cred-card-info { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .cred-card-label { font-size: 11px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.4px; }
  .cred-card-row { display: flex; gap: 8px; align-items: center; font-size: 12.5px; font-family: "Cascadia Code", Consolas, monospace; color: var(--text); }
  .copy-btn {
    background: transparent; border: none; color: var(--muted-2); padding: 6px; cursor: pointer;
    border-radius: 6px; box-shadow: none; line-height: 1; flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .copy-btn svg { width: 16px; height: 16px; display: block; }
  .copy-btn:hover { background: var(--panel-3); color: var(--text); transform: none; box-shadow: none; }
  .copy-btn.copied { color: var(--green); }
  .cred-card-row .cred-field-label { color: var(--muted-2); font-family: "Segoe UI", sans-serif; min-width: 60px; }
  .cred-card-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .cred-card-actions button {
    padding: 6px 8px; font-size: 12px; box-shadow: none; background: transparent; color: var(--muted);
    border: 1px solid var(--border);
  }
  .cred-card-actions button:hover { background: var(--panel-3); transform: none; box-shadow: none; }
  .cred-card-actions button.remove-cred:hover { background: var(--red-soft); color: var(--red); }
  .cred-empty { color: var(--muted-2); font-size: 12.5px; padding: 20px 0; text-align: center; }

  .git-meta { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 4px; }
  .pull-main-row {
    display: flex; align-items: flex-end; gap: 10px; padding: 12px; margin-top: 12px;
    background: var(--bg-2); border: 1px dashed var(--border); border-radius: var(--radius-sm);
  }
  .git-branch-settings {
    display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; margin-bottom: 16px;
  }
  .git-branch-settings .field { flex: 1; min-width: 140px; max-width: 220px; }
  .git-mode-buttons { display: flex; gap: 10px; margin-bottom: 16px; }
  .git-mode-buttons button { flex: 1; }
  .git-mode-detail {
    padding-top: 16px; border-top: 1px dashed var(--border);
    animation: panel-in 0.15s ease;
  }
  .git-file-list { max-height: 260px; overflow-y: auto; margin-bottom: 14px; }
  .git-file-row {
    display: flex; align-items: center; gap: 10px; padding: 7px 10px;
    border-bottom: 1px solid var(--border-soft); font-size: 12.5px; cursor: pointer;
  }
  .git-file-row:hover { background: var(--bg-2); }
  .git-file-row:last-child { border-bottom: none; }
  .git-file-row input[type="checkbox"], .git-select-all input[type="checkbox"] {
    accent-color: var(--accent); width: 15px; height: 15px; cursor: pointer; flex-shrink: 0;
  }
  .git-select-all {
    display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700;
    color: var(--muted-2); text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer;
  }
  .git-file-status {
    flex-shrink: 0; width: 74px; font-size: 10.5px; font-weight: 700; text-transform: uppercase;
    padding: 2px 6px; border-radius: 4px; text-align: center;
  }
  .git-file-status.status-M { background: var(--yellow-soft); color: var(--yellow); }
  .git-file-status.status-A { background: var(--green-soft); color: var(--green); }
  .git-file-status.status-D { background: var(--red-soft); color: var(--red); }
  .git-file-status.status-R { background: var(--accent-soft); color: var(--accent); }
  .git-file-status.status-untracked { background: var(--panel-3); color: var(--muted); }
  .git-file-path { font-family: "Cascadia Code", Consolas, monospace; color: var(--text); word-break: break-all; }
  .git-success {
    background: var(--green-soft); color: var(--green); font-size: 12.5px; padding: 10px 12px;
    border-radius: var(--radius-sm); margin-bottom: 12px;
  }

  .error-msg { color: var(--red); font-size: 12.5px; margin-top: 10px; }
  .caddy-status {
    font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 7px;
    padding: 8px 14px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--border-soft);
    font-weight: 500;
  }
  .caddy-status .cdot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
  .caddy-status.caddy-missing {
    cursor: pointer; border-color: var(--red); color: var(--red);
    animation: caddy-pulse 2s infinite;
  }
  .caddy-status.caddy-missing:hover { background: var(--red-soft); }
  @keyframes caddy-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,103,103,0.3); }
    50% { box-shadow: 0 0 0 5px rgba(255,103,103,0); }
  }

  @media (max-width: 720px) {
    header { padding: 16px 18px; }
    main { padding: 20px 18px 50px; }
    .modal { width: 92vw !important; padding: 20px; }
  }

  .page-loading {
    position: fixed; inset: 0; z-index: 1000;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
    background: var(--bg);
    transition: opacity 0.25s ease;
  }
  .page-loading.hidden { opacity: 0; pointer-events: none; }
  .page-loading-logo {
    width: 56px; height: 56px; border-radius: 16px;
    background: linear-gradient(135deg, var(--accent), var(--pink));
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 26px; color: white;
    box-shadow: 0 8px 24px rgba(124,110,244,0.4);

  .page-loading-spinner {
    width: 28px; height: 28px; border-radius: 50%;
    border: 3px solid var(--border); border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>

// --- Custom alert/confirm dialogs (replaces native browser alert/confirm) ---
let dialogResolveFn = null;

function dialogResolve(result) {
  document.getElementById('dialogModal').classList.remove('open');
  if (dialogResolveFn) {
    dialogResolveFn(result);
    dialogResolveFn = null;
  }
}

function showAlert(message, title) {
  return new Promise((resolve) => {
    dialogResolveFn = () => resolve();
    document.getElementById('dialogTitle').textContent = title || 'lotwork';
    document.getElementById('dialogMessage').textContent = message;
    document.querySelector('#dialogModal .dialog-modal').classList.add('alert-only');
    document.getElementById('dialogOkBtn').textContent = 'OK';
    document.getElementById('dialogModal').classList.add('open');
  });
}

function showConfirm(message, title) {
  return new Promise((resolve) => {
    dialogResolveFn = (result) => resolve(result);
    document.getElementById('dialogTitle').textContent = title || 'lotwork';
    document.getElementById('dialogMessage').textContent = message;
    document.querySelector('#dialogModal .dialog-modal').classList.remove('alert-only');
    document.getElementById('dialogOkBtn').textContent = 'OK';
    document.getElementById('dialogModal').classList.add('open');
  });
}

function getLang() {
  try {
    return localStorage.getItem('lotwork-lang') || 'en';
  } catch {
    return 'en';
  }
}

function setLang(lang) {
  try { localStorage.setItem('lotwork-lang', lang); } catch {}
  document.querySelectorAll('#langToggle button').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === lang);
  });
  render();
  updateStaticTexts();
}

function t(key, ...args) {
  const dict = I18N[getLang()] || I18N.en;
  const value = dict[key] !== undefined ? dict[key] : I18N.en[key];
  return typeof value === 'function' ? value(...args) : value;
}

function updateStaticTexts() {
  document.querySelector('header .sub').textContent = t('subtitle');
  document.getElementById('addProjectBtn').textContent = t('addProject');
  document.getElementById('reloadCaddyBtn').innerHTML = t('reloadCaddy');
  document.getElementById('fStack').options[0].textContent = t('stackPlaceholder');
  document.querySelector('#fStack option[value="custom"]').textContent = t('stackCustom');
  document.getElementById('lblName').textContent = t('fieldName');
  document.getElementById('lblFolder').textContent = t('fieldFolder');
  document.getElementById('lblStack').textContent = t('fieldStack');
  document.getElementById('lblCommand').textContent = t('fieldCommand');
  document.getElementById('lblPort').textContent = t('fieldPort');
  document.getElementById('lblDomain').textContent = t('fieldDomain');
  document.getElementById('addModalCancelBtn').textContent = t('cancel');
  document.getElementById('addModalSaveBtn').textContent = t('save');
  document.getElementById('lblCredLabel').textContent = t('fieldLabel');
  document.getElementById('lblCredUsername').textContent = t('fieldUsername');
  document.getElementById('lblCredPassword').textContent = t('fieldPassword');
  document.getElementById('credModalCancelBtn').textContent = t('cancel');
  document.getElementById('credModalSaveBtn').textContent = t('save');
  document.getElementById('servicesTitle').textContent = t('servicesTitle');
  loadServices();
  // Re-set modal titles only if the modal isn't mid-edit (avoid flashing "Add" over "Edit")
  const modalTitle = document.getElementById('modalTitle');
  if (modalTitle) modalTitle.textContent = document.getElementById('editId').value ? t('modalEditTitle') : t('modalAddTitle');
  const credModalTitle = document.getElementById('credModalTitle');
  if (credModalTitle) credModalTitle.textContent = document.getElementById('credModalId').value ? t('editCredentialTitle') : t('addCredentialTitle');
  checkCaddyStatus();
}

document.getElementById('langToggle').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-lang]');
  if (btn) setLang(btn.dataset.lang);
});

// --- Theme ---
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  document.querySelectorAll('#themeToggle button').forEach(b => {
    b.classList.toggle('active', b.dataset.theme === theme);
  });
  try { localStorage.setItem('lotwork-theme', theme); } catch {}
}

function initTheme() {
  let theme = 'dark';
  try {
    theme = localStorage.getItem('lotwork-theme') ||
      (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  } catch {}
  applyTheme(theme);
}

document.getElementById('themeToggle').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-theme]');
  if (btn) applyTheme(btn.dataset.theme);
});

initTheme();

document.querySelectorAll('#langToggle button').forEach(b => {
  b.classList.toggle('active', b.dataset.lang === getLang());
});
updateStaticTexts();

async function fetchProjects() {
  const res = await fetch('/api/projects');
  projects = await res.json();
  render();
}

function render() {
  if (projects.length === 0) {
    document.getElementById('projectRows').innerHTML =
      `<div class="empty-state">${t('emptyState')}</div>`;
    return;
  }

  const cards = projects.map(p => {
    if (p.isSelf) return renderSelfCard(p);

    const running = p.status.running;
    const busy = pendingIds.has(p.id);
    const domainLink = p.domain
      ? `<a class="domain-link" href="https://${p.domain}" target="_blank">${p.domain}</a>`
      : `<span class="badge">${t('noDomain')}</span>`;

          <button class="secondary small ${expandedPanels.get(p.id) === 'env' ? 'panel-btn-active' : ''}" onclick="togglePanel('${p.id}', 'env')">${t('editEnv')}</button>

  if (gc.untracked) parts.push(t('untrackedCount', gc.untracked));
  return `<span class="badge changes-badge" title="${escapeHtml(parts.join(', '))}">${t('unpushedChanges', gc.total)}</span>`;
}

function formatLastStarted(timestamp) {
  const date = new Date(timestamp);
  const time = date.toLocaleTimeString('id-ID', {
    hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Jakarta',
  });
  const today = new Date();
  const isToday = date.toDateString() === today.toDateString();
  if (isToday) return `${time} WIB`;
  const dateStr = date.toLocaleDateString('id-ID', {
    day: '2-digit', month: 'short', timeZone: 'Asia/Jakarta',
  });
  return `${dateStr}, ${time} WIB`;
}

function formatCommitDate(gitDateStr) {
  // git's %ci format: "2026-09-19 12:27:19 +0700" - parseable by Date directly
  const date = new Date(gitDateStr.replace(' ', 'T').replace(' ', ''));
  if (isNaN(date.getTime())) return gitDateStr;
  const locale = getLang() === 'id' ? 'id-ID' : 'en-US';
  return date.toLocaleString(locale, {
    day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit',
  });
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

const COPY_ICON = `<svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect x="7" y="7" width="10" height="10" rx="2" stroke="currentColor" stroke-width="1.6"/>
  <path d="M13 7V5.5C13 4.67157 12.3284 4 11.5 4H4.5C3.67157 4 3 4.67157 3 5.5V12.5C3 13.3284 3.67157 14 4.5 14H6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
</svg>`;

const CHECK_ICON = `<svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M4 10.5L8 14.5L16 5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>`;

async function copyToClipboard(btn, text) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }
  btn.innerHTML = CHECK_ICON;
  btn.classList.add('copied');
  setTimeout(() => {
    btn.innerHTML = COPY_ICON;
    btn.classList.remove('copied');
  }, 1200);
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function startProject(id) {
  if (pendingIds.has(id)) return;
  pendingIds.add(id);
  render();
  try {
    const res = await fetch(`/api/projects/${id}/start`, { method: 'POST' });
    const data = await res.json();
    if (!res.ok) {
      await showAlert(data.error);
      return;
    }

    // Poll until the project's port actually accepts connections (or the
    // process crashes / we time out), rather than just trusting the process
    // spawned successfully — a spawned process isn't necessarily ready yet.
    const maxAttempts = 20; // ~20s
    for (let attempt = 0; attempt < maxAttempts; attempt++) {
      await sleep(1000);
      await fetchProjects();
      const p = projects.find(x => x.id === id);
      if (!p) break;
      if (!p.status.running) {
        // process died before becoming ready (e.g. missing deps) - show logs
        if (expandedPanels.get(id) !== 'logs') togglePanel(id, 'logs');
        break;
      }
      const readyRes = await fetch(`/api/projects/${id}/ready`);
      const readyData = await readyRes.json();
      if (readyData.ready) break;
    }
  } finally {
    pendingIds.delete(id);
    await fetchProjects();
  }
}

async function stopProject(id) {
  if (pendingIds.has(id)) return;
  pendingIds.add(id);
  render();
  try {
    await fetch(`/api/projects/${id}/stop`, { method: 'POST' });
  } finally {
    pendingIds.delete(id);
    await fetchProjects();
  }
}

async function deleteProject(id) {
  if (!(await showConfirm(t('confirmDeleteProject')))) return;
  if (pendingIds.has(id)) return;
  pendingIds.add(id);
  render();
  try {
    await fetch(`/api/projects/${id}`, { method: 'DELETE' });
  } finally {
    pendingIds.delete(id);
    await fetchProjects();
  }
}

const STACK_TEMPLATES = {
  'node-dev': 'npm run dev',
  'node-start': 'npm start',
  'yarn-dev': 'yarn dev',
  'pnpm-dev': 'pnpm dev',
  'laravel': 'php artisan serve --port={PORT}',
  'php-builtin': 'php -S localhost:{PORT} -t public',
  'django': 'python manage.py runserver 0.0.0.0:{PORT}',
  'flask': 'flask run --port={PORT}',
  'custom': '',
};

const STACK_PORT_BASE = {
  'node-dev': { base: 3000, max: 4000 },
  'node-start': { base: 3000, max: 4000 },
  'yarn-dev': { base: 3000, max: 4000 },
  'pnpm-dev': { base: 3000, max: 4000 },
  'laravel': { base: 8000, max: 9000 },
  'php-builtin': { base: 8080, max: 9080 },
  'django': { base: 8000, max: 9000 },
  'flask': { base: 5000, max: 6000 },
};

async function applyStackTemplate() {
  const stack = document.getElementById('fStack').value;
  if (!stack || !(stack in STACK_TEMPLATES)) return;

  const portField = document.getElementById('fPort');
  if (!portField.value && STACK_PORT_BASE[stack]) {
    const { base, max } = STACK_PORT_BASE[stack];
    try {
      const res = await fetch(`/api/ports/next?base=${base + 1}&max=${max}`);
      const data = await res.json();
      if (res.ok) portField.value = data.port;
    } catch {}
  }

  const port = portField.value || '{PORT}';
  document.getElementById('fCommand').value = STACK_TEMPLATES[stack].replace('{PORT}', port);
}

function openAddModal() {
  document.getElementById('modalTitle').textContent = 'Tambah Project';
  document.getElementById('editId').value = '';
  document.getElementById('fName').value = '';
  document.getElementById('fCwd').value = '';
  document.getElementById('fStack').value = '';
  document.getElementById('fCommand').value = '';

  document.getElementById('formError').textContent = '';

}

function openEditModal(id) {
  const p = projects.find(x => x.id === id);
  if (!p) return;
  document.getElementById('modalTitle').textContent = 'Edit Project';
  document.getElementById('editId').value = p.id;
  document.getElementById('fName').value = p.name;
  document.getElementById('fCwd').value = p.cwd;
  document.getElementById('fStack').value = p.stack || '';
  document.getElementById('fCommand').value = p.command;

  document.getElementById('addModal').classList.remove('open');
}

async function submitProject() {
  const id = document.getElementById('editId').value;
  const domainName = document.getElementById('fDomain').value.trim().replace(/\.local$/, '');
  const body = {
    name: document.getElementById('fName').value.trim(),
    cwd: document.getElementById('fCwd').value.trim(),
    command: document.getElementById('fCommand').value.trim(),
    port: Number(document.getElementById('fPort').value),
    domain: domainName ? `${domainName}.local` : '',
    stack: document.getElementById('fStack').value,
  };
  if (!body.name || !body.cwd || !body.command || !body.port) {
    document.getElementById('formError').textContent = t('requiredFieldsError');
    return;
  }
  const url = id ? `/api/projects/${id}` : '/api/projects';
  const method = id ? 'PUT' : 'POST';
  const res = await fetch(url, {
    method,
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const data = await res.json();
  if (!res.ok) {
    document.getElementById('formError').textContent = data.error;
    return;
  }
  closeAddModal();
  fetchProjects();
  if (data.sync && data.sync.hostsOk === false) {
    await showAlert(`${t('hostsSyncFailedAlert')}\n\n${data.sync.hostsMessage}\n\n${t('hostsSyncFailedHint')}`);
  }
  if (data.nextOrigin && data.nextOrigin.ok === false && data.nextOrigin.reason === 'unrecognized_format') {
    await showAlert(`${t('nextOriginUnrecognized')}\n\n${data.nextOrigin.message}`);
  }
  checkCaddyStatus();
}

// --- Inline expandable panels (Logs / Edit .env / Credentials) ---
const expandedPanels = new Map(); // projectId -> 'logs' | 'env' | 'credentials'
const envDrafts = new Map(); // projectId -> { entries, loaded, error }
const logCache = new Map(); // projectId -> last fetched log text

function togglePanel(id, type) {
  const current = expandedPanels.get(id);
  if (current === type) {
    expandedPanels.delete(id);
  } else {
    expandedPanels.set(id, type);
    if (type === 'env' && !envDrafts.has(id)) loadEnvDraft(id);
    if (type === 'logs') pollLogsFor(id);
    if (type === 'git') loadGitStatus(id);
  }
  render();
}

function renderPanel(p) {
  const type = expandedPanels.get(p.id);
  if (!type) return '';
  if (type === 'logs') return renderLogsPanel(p);
  if (type === 'env') return renderEnvPanel(p);
  if (type === 'credentials') return renderCredentialsPanel(p);
  if (type === 'git') return renderGitPanel(p);
  return '';
}

// --- Logs panel ---
function renderLogsPanel(p) {
  const logs = logCache.get(p.id) || t('loadingLogs');
  return `
    <div class="inline-panel">
      <div class="inline-panel-title">${t('logs')}</div>
      <pre class="log-box" id="logBox-${p.id}">${escapeHtml(logs)}</pre>
    </div>
  `;
}

async function pollLogsFor(id) {
  if (expandedPanels.get(id) !== 'logs') return;
  const res = await fetch(`/api/projects/${id}/logs`);
  const data = await res.json();
  const logs = data.logs || t('noOutputYet');
  logCache.set(id, logs);
  const box = document.getElementById(`logBox-${id}`);
  if (box) {
    const wasAtBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 20;
    box.textContent = logs;
    if (wasAtBottom) box.scrollTop = box.scrollHeight;
  }
}

function restoreLogScroll() {
  for (const [id, type] of expandedPanels) {
    if (type === 'logs') pollLogsFor(id);
  }
}

setInterval(() => {
  for (const [id, type] of expandedPanels) {
    if (type === 'logs') pollLogsFor(id);
  }
}, 1500);

// --- Edit .env panel ---
async function loadEnvDraft(id) {
  envDrafts.set(id, { entries: [], loaded: false, error: '' });
  const res = await fetch(`/api/projects/${id}/env`);
  const data = await res.json();
  if (!res.ok) {
    envDrafts.set(id, { entries: [], loaded: true, error: data.error || t('envLoadFailed') });
  } else {
    envDrafts.set(id, { entries: data.entries, loaded: true, error: '' });
  }
  render();
}

function renderEnvPanel(p) {
  const draft = envDrafts.get(p.id);
  if (!draft || !draft.loaded) {
    return `<div class="inline-panel"><div class="env-empty">${t('loadingEnv')}</div></div>`;
  }
  const rows = draft.entries.length
    ? draft.entries.map((entry, i) => {
        const isLocal = entry.source === '.env.local';
        return `
          <div class="env-row">
            <input class="env-key" placeholder="KEY" value="${escapeHtml(entry.key)}" oninput="updateEnvEntry('${p.id}', ${i}, 'key', this.value)" />
            <input class="env-value" placeholder="value" value="${escapeHtml(entry.value)}" oninput="updateEnvEntry('${p.id}', ${i}, 'value', this.value)" />
            <span class="source-badge ${isLocal ? 'env-local' : 'env'}" title="${t('envSourceHint')}" onclick="toggleEnvSource('${p.id}', ${i})">${isLocal ? 'local' : 'env'}</span>
            <button type="button" class="remove-row" title="${t('delete')}" onclick="removeEnvRow('${p.id}', ${i})">&times;</button>
          </div>
        `;
      }).join('')
    : `<div class="env-empty">${t('envNoVars')}</div>`;

  return `
    <div class="inline-panel">
      <div class="inline-panel-title">${t('editEnv')}</div>
      <div class="modal-subtitle" style="margin-top:0">${t('envSubtitle')}</div>
      <div class="env-row-head">
        <span class="col-key">${t('envKey')}</span>
        <span class="col-value">${t('envValue')}</span>
      </div>
      <div id="envRows-${p.id}">${rows}</div>
      ${draft.error ? `<div class="error-msg">${escapeHtml(draft.error)}</div>` : ''}
      <div class="modal-actions env-footer">
        <div class="env-legend">
          <span><span class="source-badge env">env</span> ${t('envLegendEnv')}</span>
          <span><span class="source-badge env-local">local</span> ${t('envLegendLocal')}</span>
        </div>
        <div style="display:flex; gap:8px;">
          <button type="button" class="secondary small" onclick="addEnvRow('${p.id}')">${t('addVariable')}</button>
          <button onclick="saveEnv('${p.id}')">${t('save')}</button>
        </div>
      </div>
    </div>
  `;
}

function updateEnvEntry(id, i, field, value) {
  const draft = envDrafts.get(id);
  if (!draft) return;
  draft.entries[i][field] = value;
}

function toggleEnvSource(id, i) {
  const draft = envDrafts.get(id);
  if (!draft) return;
  draft.entries[i].source = draft.entries[i].source === '.env.local' ? '.env' : '.env.local';
  render();
}

function addEnvRow(id) {
  const draft = envDrafts.get(id);
  if (!draft) return;
  draft.entries.push({ key: '', value: '', source: '.env' });
  render();
}

function removeEnvRow(id, i) {
  const draft = envDrafts.get(id);
  if (!draft) return;
  draft.entries.splice(i, 1);
  render();
}

async function saveEnv(id) {
  const draft = envDrafts.get(id);
  if (!draft) return;
  const entries = draft.entries.filter(e => e.key.trim());
  const res = await fetch(`/api/projects/${id}/env`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ entries }),
  });
  const data = await res.json();
  if (!res.ok) {
    draft.error = data.error || t('envSaveFailed');
    render();
    return;
  }
  expandedPanels.delete(id);
  envDrafts.delete(id);
  render();
}

function editCredential(id, credId) {
  openCredentialModal(id, credId);

function closeCredentialModal() {
  document.getElementById('credentialModal').classList.remove('open');
}

async function saveCredentialModal() {
  const id = document.getElementById('credModalProjectId').value;
  const credId = document.getElementById('credModalId').value;
  const body = {
    label: document.getElementById('credModalLabel').value.trim(),
    username: document.getElementById('credModalUsername').value.trim(),
    password: document.getElementById('credModalPassword').value,
  };
  if (!body.username || !body.password) {
    document.getElementById('credModalError').textContent = t('credRequiredError');
    return;
  }
  const url = credId
    ? `/api/projects/${id}/credentials/${credId}`
    : `/api/projects/${id}/credentials`;
  const res = await fetch(url, {
    method: credId ? 'PUT' : 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const data = await res.json();
  if (!res.ok) {
    document.getElementById('credModalError').textContent = data.error || t('credSaveFailed');
    return;
  }
  closeCredentialModal();
  await fetchProjects();
}

async function deleteCredential(id, credId) {
  if (!(await showConfirm(t('confirmDeleteCredential')))) return;
  await fetch(`/api/projects/${id}/credentials/${credId}`, { method: 'DELETE' });
  await fetchProjects();
}

// --- Git panel ---
const gitStatusCache = new Map(); // projectId -> { loading, data, error, selectedBranch, pushing, result }

function statusLabel(code) {
  const map = {
    'M': 'statusModified', 'A': 'statusAdded', 'D': 'statusDeleted', 'R': 'statusRenamed',
    'C': 'statusCopied', 'U': 'statusUnmerged', '??': 'statusUntracked',
  };
  return map[code] ? t(map[code]) : code;
}

async function loadGitStatus(id) {
  gitStatusCache.set(id, { loading: true });
  render();
  try {
    const res = await fetch(`/api/projects/${id}/git/status`);
    const data = await res.json();
    if (!res.ok) {
      gitStatusCache.set(id, { loading: false, error: data.error });
    } else if (!data.isRepo) {
      // Not a git repository at all (or no .git folder) - nothing further to compute.
      gitStatusCache.set(id, { loading: false, data });
    } else {
      const project = projects.find(x => x.id === id);
      const candidateMain = (project && project.defaultBranch && project.defaultBranch !== data.currentBranch)
        ? project.defaultBranch
        : data.branches.find(b => b !== data.currentBranch);
      gitStatusCache.set(id, {
        loading: false,
        data,
        selectedBranch: data.currentBranch,
        selectedMainBranch: candidateMain || data.currentBranch,
        selectedFiles: new Set(data.files.map(f => f.path)), // all checked by default
      });
    }
  } catch (e) {
    gitStatusCache.set(id, { loading: false, error: e.message });
  }
  render();
}

async function initGitRepo(id) {
  const state = gitStatusCache.get(id);
  if (!state) return;
  state.initializing = true;
  state.initError = null;
  render();
  try {
    const res = await fetch(`/api/projects/${id}/git/init`, { method: 'POST' });
    const data = await res.json();
    if (!res.ok) {
      state.initError = data.error || t('gitInitFailed');
      return;
    }
    await loadGitStatus(id);
  } catch (e) {
    state.initError = e.message;
  } finally {
    state.initializing = false;
    render();
  }
}

async function saveRemoteUrl(id) {
  const input = document.getElementById(`remoteUrlInput-${id}`);
  const url = input.value.trim();
  const state = gitStatusCache.get(id);
  if (!state) return;
  if (!url) {
    state.remoteError = t('remoteUrlRequired');
    render();
    return;
  }

  const wasEditingExisting = !!(state.data && state.data.remoteUrl);
  state.savingRemote = true;
  state.remoteError = null;
  state.remoteSuccess = null;
  render();

  try {
    const res = await fetch(`/api/projects/${id}/git/remote`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url }),
    });
    const data = await res.json();
    if (!res.ok) {
      state.remoteError = data.error || t('setRemoteFailed');
      return;
    }
    await fetchProjects();
    if (wasEditingExisting) {
      // Refresh status in the background but keep the confirmation visible
      // instead of resetting gitMode and closing the "remote" detail panel.
      const res2 = await fetch(`/api/projects/${id}/git/status`);
      const freshData = await res2.json();
      const refreshedState = gitStatusCache.get(id);
      if (refreshedState) {
        refreshedState.data = freshData;
        refreshedState.remoteUrlDraft = undefined;
        refreshedState.remoteSuccess = t('remoteUrlUpdated');
      }
    } else {
      await loadGitStatus(id);
    }
  } catch (e) {
    state.remoteError = e.message;
  } finally {
    const finalState = gitStatusCache.get(id);
    if (finalState) finalState.savingRemote = false;
    render();
  }
}

function toggleGitFile(id, filePath, checked) {
  const state = gitStatusCache.get(id);
  if (!state) return;
  if (checked) state.selectedFiles.add(filePath);
  else state.selectedFiles.delete(filePath);
  render();
}

function toggleAllGitFiles(id, checked) {
  const state = gitStatusCache.get(id);
  if (!state || !state.data) return;
  state.selectedFiles = checked ? new Set(state.data.files.map(f => f.path)) : new Set();
  render();
}

function setGitBranch(id, branch) {
  const state = gitStatusCache.get(id);
  if (!state) return;
  state.selectedBranch = branch;
}

function renderGitPanel(p) {
  const state = gitStatusCache.get(p.id);

  if (!state || state.loading) {
    return `<div class="inline-panel"><div class="env-empty">${t('loadingGitStatus')}</div></div>`;
  }

  if (state.error) {
    return `
      <div class="inline-panel">
        <div class="inline-panel-title">${t('github')}</div>
        <div class="error-msg">${escapeHtml(state.error)}</div>
      </div>
    `;
  }

  const { data } = state;

  if (!data.isRepo) {
    return `
      <div class="inline-panel">
        <div class="inline-panel-title">${t('github')}</div>
        <div class="modal-subtitle" style="margin-top:0">${t('notGitRepoSubtitle')}</div>
        ${state.initError ? `<div class="error-msg">${escapeHtml(state.initError)}</div>` : ''}
        <div class="modal-actions" style="justify-content:flex-start;">
          <button ${state.initializing ? 'disabled' : ''} onclick="initGitRepo('${p.id}')">${state.initializing ? t('initializing') : t('initializeGit')}</button>
        </div>
      </div>
    `;
  }

  if (!data.remoteUrl) {
    return `
      <div class="inline-panel">
        <div class="inline-panel-title">${t('github')}</div>
        <div class="modal-subtitle" style="margin-top:0">${t('setRemoteSubtitle')}</div>
        <div class="field">
          <label>${t('remoteUrlLabel')}</label>
          <input id="remoteUrlInput-${p.id}" placeholder="git@github.com:user/repo.git" />
        </div>
        ${state.remoteError ? `<div class="error-msg">${escapeHtml(state.remoteError)}</div>` : ''}
        <div class="modal-actions" style="justify-content:flex-start;">
          <button onclick="saveRemoteUrl('${p.id}')">${t('setRemote')}</button>
        </div>
      </div>
    `;
  }

  const allChecked = data.files.length > 0 && data.files.every(f => state.selectedFiles.has(f.path));
  const someChecked = data.files.some(f => state.selectedFiles.has(f.path));

  const fileList = data.files.length
    ? data.files.map(f => `
        <label class="git-file-row">
          <input type="checkbox" ${state.selectedFiles.has(f.path) ? 'checked' : ''} onchange="toggleGitFile('${p.id}', '${escapeHtml(f.path).replace(/'/g, "\\'")}', this.checked)" />
          <span class="git-file-status status-${f.status.replace('?', 'untracked')}">${escapeHtml(statusLabel(f.status))}</span>
          <span class="git-file-path">${escapeHtml(f.path)}</span>
        </label>
      `).join('')
    : `<div class="env-empty">${t('noChanges')}</div>`;

  const branchOptions = data.branches.map(b =>
    `<option value="${escapeHtml(b)}" ${b === state.selectedBranch ? 'selected' : ''}>${escapeHtml(b)}</option>`
  ).join('');

  const mainBranchOptions = data.branches
    .filter(b => b !== data.currentBranch)
    .map(b => `<option value="${escapeHtml(b)}" ${b === state.selectedMainBranch ? 'selected' : ''}>${escapeHtml(b)}</option>`)
    .join('');

  const aheadBehind = [];
  if (data.ahead) aheadBehind.push(`${data.ahead} ${t('ahead')}`);
  if (data.behind) aheadBehind.push(`${data.behind} ${t('behind')}`);

  const mode = state.gitMode; // null | 'pull' | 'push'

  const pullDetail = mode === 'pull' ? `
    <div class="git-mode-detail">
      ${state.pullError ? `<div class="error-msg">${escapeHtml(state.pullError)}</div>` : ''}
      ${state.pullSuccess ? `<div class="git-success">${escapeHtml(state.pullSuccess)}</div>` : ''}
      <div class="modal-actions" style="justify-content:flex-start;">
        <button ${(!mainBranchOptions || state.pulling) ? 'disabled' : ''} onclick="confirmPullFromMain('${p.id}')">${state.pulling ? t('pulling') : t('pullFromMaster')}</button>
      </div>
    </div>
  ` : '';

  const pushDetail = mode === 'push' ? `
    <div class="git-mode-detail">
      <div class="env-row-head" style="justify-content:space-between; display:flex;">
        <label class="git-select-all">
          <input type="checkbox" ${allChecked ? 'checked' : ''} ${data.files.length === 0 ? 'disabled' : ''} onchange="toggleAllGitFiles('${p.id}', this.checked)" />
          ${t('changesSelected', state.selectedFiles.size, data.files.length)}
        </label>
      </div>
      <div class="git-file-list">${fileList}</div>
      ${state.result ? `<div class="git-success">${escapeHtml(state.result)}</div>` : ''}
      ${state.pushError ? `<div class="error-msg">${escapeHtml(state.pushError)}</div>` : ''}
      <div class="modal-actions" style="justify-content:space-between;">
        <button type="button" class="secondary small" onclick="loadGitStatus('${p.id}')">${t('refresh')}</button>
        <button ${(!someChecked || state.pushing) ? 'disabled' : ''} onclick="confirmGitPush('${p.id}')">${state.pushing ? t('pushing') : t('commitAndPush')}</button>
      </div>
    </div>
  ` : '';

  const remoteDetail = mode === 'remote' ? `
    <div class="git-mode-detail">
      <div class="field">
        <label>${t('remoteUrlLabel')}</label>
        <input id="remoteUrlInput-${p.id}" value="${escapeHtml(state.remoteUrlDraft !== undefined ? state.remoteUrlDraft : data.remoteUrl || '')}" placeholder="git@github.com:user/repo.git" oninput="updateRemoteUrlDraft('${p.id}', this.value)" />
      </div>
      ${state.remoteError ? `<div class="error-msg">${escapeHtml(state.remoteError)}</div>` : ''}
      ${state.remoteSuccess ? `<div class="git-success">${escapeHtml(state.remoteSuccess)}</div>` : ''}
      <div class="modal-actions" style="justify-content:flex-start;">
        <button ${state.savingRemote ? 'disabled' : ''} onclick="saveRemoteUrl('${p.id}')">${state.savingRemote ? t('saving') : t('save')}</button>
      </div>
    </div>
  ` : '';

  return `
    <div class="inline-panel">
      <div class="inline-panel-title">${t('github')}</div>
      <div class="git-branch-settings">
        <div class="field" style="margin-bottom:0;">
          <label>${t('currentBranchLabel')}</label>
          <select onchange="setGitBranch('${p.id}', this.value)">${branchOptions}</select>
        </div>
        <div class="field" style="margin-bottom:0;">
          <label>${t('mainBranchLabel')}</label>
          <select id="mainBranchSelect-${p.id}" ${mainBranchOptions ? '' : 'disabled'}>${mainBranchOptions || `<option>${escapeHtml(data.currentBranch)}</option>`}</select>
        </div>
        ${aheadBehind.length ? `<span class="badge">${aheadBehind.join(', ')}</span>` : ''}
      </div>

      <div class="git-mode-buttons">
        <button type="button" class="secondary ${mode === 'pull' ? 'panel-btn-active' : ''}" onclick="setGitMode('${p.id}', 'pull')">${t('pullFromMaster')}</button>
        <button type="button" class="secondary ${mode === 'push' ? 'panel-btn-active' : ''}" onclick="setGitMode('${p.id}', 'push')">${t('pushCommitChanges')}</button>
        <button type="button" class="secondary ${mode === 'remote' ? 'panel-btn-active' : ''}" onclick="setGitMode('${p.id}', 'remote')">${t('remoteSettings')}</button>
      </div>

      ${pullDetail}
      ${pushDetail}
      ${remoteDetail}
    </div>
  `;
}

function updateRemoteUrlDraft(id, value) {
  const state = gitStatusCache.get(id);
  if (!state) return;
  state.remoteUrlDraft = value;
}

function setGitMode(id, mode) {
  const state = gitStatusCache.get(id);
  if (!state) return;
  state.gitMode = state.gitMode === mode ? null : mode;
  render();
}

async function confirmPullFromMain(id) {
  const state = gitStatusCache.get(id);
  if (!state || !state.data) return;
  const select = document.getElementById(`mainBranchSelect-${id}`);
  const mainBranch = select.value;
  const currentBranch = state.data.currentBranch;

  const confirmed = await showConfirm(t('confirmPullFromMain', mainBranch, currentBranch));
  if (!confirmed) return;

  state.pulling = true;
  state.pullError = null;
  state.pullSuccess = null;
  render();

  try {
    const res = await fetch(`/api/projects/${id}/git/pull-main`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mainBranch, currentBranch }),
    });
    const result = await res.json();
    if (!res.ok) {
      state.pullError = result.error || t('pullFromMainFailed');
    } else {
      state.pullSuccess = t('pullFromMainSuccess', mainBranch, currentBranch);
      await loadGitStatus(id);
      return;
    }
  } catch (e) {
    state.pullError = e.message;
  } finally {
    state.pulling = false;
    render();
  }
}

async function confirmGitPush(id) {
  const state = gitStatusCache.get(id);
  if (!state || !state.data) return;
  const { data, selectedBranch, selectedFiles } = state;

  const selectedFileList = data.files.filter(f => selectedFiles.has(f.path));
  if (selectedFileList.length === 0) return;

  const fileListText = selectedFileList.map(f => `  ${statusLabel(f.status)}: ${f.path}`).join('\n');
  const confirmed = await showConfirm(
    `${t('confirmPushTitle', selectedBranch)}\n\n` +
    `${t('confirmPushFiles', selectedFileList.length)}\n${fileListText}\n\n` +
    `${t('confirmPushAutoMessage')}`
  );
  if (!confirmed) return;

  state.pushing = true;
  state.pushError = null;
  state.result = null;
  render();

  try {
    const res = await fetch(`/api/projects/${id}/git/push`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ branch: selectedBranch, files: selectedFileList.map(f => f.path) }),
    });
    const result = await res.json();
    if (!res.ok) {
      state.pushError = result.error || t('pushFailed');
    } else {
      state.result = t('pushSuccess', result.branch, result.message);
      await loadGitStatus(id);
      return;
    }
  } catch (e) {
    state.pushError = e.message;
  } finally {
    state.pushing = false;
    render();
  }
}

async function reloadCaddy() {
  const btn = document.getElementById('reloadCaddyBtn');
  if (btn.disabled) return;
  btn.disabled = true;
  const originalHtml = btn.innerHTML;
  btn.textContent = t('reloading');
  try {
    const res = await fetch('/api/caddy/reload', { method: 'POST' });
    const data = await res.json();
    await showAlert(data.message + (data.hostsOk === false ? `\n\n${data.hostsMessage}` : ''));
    await checkCaddyStatus();
  } finally {
    btn.disabled = false;
    btn.innerHTML = originalHtml;
  }
}

let caddyInstalling = false;

let caddyAlertShownFor = null; // tracks which problem we've already popped up, so we don't nag on every 4s poll

async function checkCaddyStatus() {
  const res = await fetch('/api/caddy/status');
  const data = await res.json();
  const el = document.getElementById('caddyStatus');
  if (data.installed) {
    el.innerHTML = `<span class="cdot"></span>${t('caddyInstalled')}`;
    el.classList.remove('caddy-missing');
    el.onclick = null;
    caddyAlertShownFor = null;
  } else {
    const problemKey = data.needsRestart ? 'needsRestart' : 'notInstalled';
    const label = data.needsRestart ? t('caddyNeedsRestart') : t('caddyNotInstalled');
    el.innerHTML = `<span class="cdot" style="background:var(--red)"></span>${label}`;
    el.classList.add('caddy-missing');
    el.onclick = () => handleCaddyMissing(data.needsRestart);

    if (caddyAlertShownFor !== problemKey) {
      caddyAlertShownFor = problemKey;
      handleCaddyMissing(data.needsRestart);
    }
  }
}

async function handleCaddyMissing(needsRestart) {
  if (needsRestart) {
    await showAlert(t('caddyRestartInstructions'));
    return;
  }
  const confirmed = await showConfirm(t('caddyInstallConfirm'));
  if (!confirmed) return;
  installCaddy();
}

async function installCaddy() {
  if (caddyInstalling) return;
  caddyInstalling = true;
  const el = document.getElementById('caddyStatus');
  el.innerHTML = `<span class="cdot" style="background:var(--yellow)"></span>${t('caddyInstalling')}`;
  try {
    const res = await fetch('/api/caddy/install', { method: 'POST' });
    const data = await res.json();
    if (!res.ok) {
      await showAlert(`${t('caddyInstallFailed')}\n\n${data.error}`);
    } else {
      await showAlert(t('caddyRestartInstructions'));
    }
  } catch (e) {
    await showAlert(`${t('caddyInstallFailed')}\n\n${e.message}`);
  } finally {
    caddyInstalling = false;
    checkCaddyStatus();
  }
}

// --- System services sidebar ---
const servicePending = new Set();

async function loadServices() {
  try {
    const res = await fetch('/api/services');
    const data = await res.json();
    renderServices(data);
  } catch (e) {
    document.getElementById('servicesList').innerHTML = `<div class="services-empty">${t('servicesLoadFailed')}</div>`;
  }
}

function renderServices(data) {
  const { services, runtimes } = data;

  const serviceRows = services.length
    ? services.map(s => {
        const busy = servicePending.has(s.serviceName);
        const label = busy ? (s.running ? t('stopping') : t('starting')) : (s.running ? t('stop') : t('start'));
        return `
          <div class="service-row">
            <div class="service-info">
              <span class="service-name">${escapeHtml(s.label)}</span>
              <span class="service-sub">${s.running ? t('running') : t('stopped')}</span>
            </div>
            <button class="service-toggle ${s.running ? 'on' : 'off'}" ${busy ? 'disabled' : ''}
              onclick="toggleService('${escapeHtml(s.serviceName)}', ${s.running})">${label}</button>
          </div>
        `;
      }).join('')
    : `<div class="services-empty">${t('noServicesFound')}</div>`;

  const runtimeRows = runtimes.map(r => `
    <div class="runtime-row">
      <span class="runtime-name">${escapeHtml(r.label)}</span>
      <span class="runtime-version">${r.installed ? escapeHtml(r.version) : t('notInstalledShort')}</span>
    </div>
  `).join('');

  document.getElementById('servicesList').innerHTML = `
    ${serviceRows}
    <hr class="services-divider" />
    ${runtimeRows}
  `;
}

async function toggleService(serviceName, currentlyRunning) {
  if (servicePending.has(serviceName)) return;
  servicePending.add(serviceName);
  await loadServices();
  try {
    const action = currentlyRunning ? 'stop' : 'start';
    const res = await fetch(`/api/services/${encodeURIComponent(serviceName)}/${action}`, { method: 'POST' });
    const data = await res.json();
    if (!res.ok) {
      await showAlert(data.error || t('serviceActionFailed'));
    }
  } catch (e) {
    await showAlert(e.message);
  } finally {
    servicePending.delete(serviceName);
    await loadServices();
  }
}

Promise.all([fetchProjects(), checkCaddyStatus(), loadServices()]).finally(() => {
  document.getElementById('pageLoading').classList.add('hidden');
});
setInterval(fetchProjects, 4000);
setInterval(loadServices, 8000);
</script>
